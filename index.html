/* === SVG Helpers === */
function pawSVG(size, color) {
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 100 100" fill="'+color+'"><ellipse cx="50" cy="68" rx="20" ry="18"/><ellipse cx="24" cy="44" rx="9" ry="11" transform="rotate(-20 24 44)"/><ellipse cx="76" cy="44" rx="9" ry="11" transform="rotate(20 76 44)"/><ellipse cx="40" cy="26" rx="8" ry="11" transform="rotate(-8 40 26)"/><ellipse cx="60" cy="26" rx="8" ry="11" transform="rotate(8 60 26)"/></svg>';
}
function xSVG(size, color) {
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 100 100" fill="none" stroke="'+color+'" stroke-linecap="round" stroke-linejoin="round"><line x1="15" y1="15" x2="85" y2="85" stroke-width="10"/><line x1="85" y1="15" x2="15" y2="85" stroke-width="10"/></svg>';
}
/* THE ARROW AS GEOMETRY, NOT AS A GLYPH. `back.textContent = '\u2190'` centres the text
 * BOX and leaves the arrow visibly off-centre inside it, because a glyph's ink does not
 * sit in the middle of its em square and the left-arrow's side bearings are asymmetric
 * in the fallback fonts an Android tablet actually has. Scotty saw it on the device. No
 * amount of flex centring fixes a font metric; a path is centred by construction, and
 * this one is symmetric about (12,12) in its own viewBox. */
function backArrowSVG(size, color) {
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="'+color+'" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 5 L8.5 12 L15.5 19"/></svg>';
}
function lockSVG(size, color, locked) {
  var body = locked ? '<rect x="3" y="11" width="18" height="11" rx="2" fill="'+color+'"/><path d="M7 11V7a5 5 0 0 1 10 0v4" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round"/>' : '<rect x="3" y="11" width="18" height="11" rx="2" fill="none" stroke="'+color+'" stroke-width="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round"/>';
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24">'+body+'</svg>';
}

/* === Audio === */
var audioCtx = null;
function getAudioCtx() {
  if (!audioCtx || audioCtx.state === 'closed') audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
/* mk() AND sw() LIVE HERE, NOT INSIDE doSound. That move is the whole cost of
 * api.tone, and architecture §5 says so in the row that ratifies it: the findings
 * estimated one function over existing helpers, and CC-A corrected the estimate
 * because both helpers were declared inside doSound's try block and were therefore
 * reachable from nowhere else. Nothing about either body changed; they take the
 * audio context from getAudioCtx() instead of closing over doSound's local, which
 * is the same object and the same currentTime read the cues always made per call. */
function mk(freq, dur, wave, delay, vol) {
  var c = getAudioCtx();
  var o = c.createOscillator(), g = c.createGain();
  o.type = wave; o.frequency.value = freq;
  var t = c.currentTime + (delay || 0), v = vol || 0.12;
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur);
  return o;
}
function sw(f1, f2, dur, wave, delay, vol) {
  var c = getAudioCtx();
  var o = c.createOscillator(), g = c.createGain();
  o.type = wave; var t = c.currentTime + (delay || 0), v = vol || 0.12;
  o.frequency.setValueAtTime(f1, t); o.frequency.linearRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur);
}

/* THE api.tone PRIMITIVE — ratified in architecture §5 on 2026-09-01, built here on
 * 2026-09-02 by PUP-WO-0300 §2.1. The twelve-cue bank offers no pitch and no
 * duration, so a xylophone, a lullaby or an aquarium is INEXPRESSIBLE through
 * api.sound, and the only escape was editing the switch table above — which makes
 * northstar invariant 6's "nothing else" false for any game that wants a note.
 *
 * EVERY ARGUMENT IS CLAMPED, and the reason is not tidiness. A game module runs in
 * this realm and hands these values straight to a live AudioContext: a frequency of
 * 0 or NaN throws, a negative duration schedules a stop before its start, and 40 kHz
 * at 30 seconds is a sound a three-year-old is wearing headphones for. The bounds are
 * a child's ears and a child's patience, and a game that wants more does not get it.
 * An unknown wave name becomes 'sine' rather than throwing, because a game asking for
 * a sound it cannot have should still make one. */
var TONE_WAVES = ['sine', 'square', 'sawtooth', 'triangle'];

/* A VOICE CAP AND A REGISTRY, BOTH ADDED AFTER THE ADVERSARIAL PASS MEASURED WHAT ONE
 * CLAMP PER CALL IS WORTH. Two findings, both real:
 *
 *   THE SUM WAS NOT BOUNDED. Each voice is a gain of 0.12 straight to `destination` —
 *   no master gain, no compressor — so roughly 8.3 simultaneous notes reach full scale.
 *   Rendered offline: ten notes landing together peak at 1.16 and HARD CLIP, which is
 *   audible as a crack rather than as loudness. Ten fingers landing together is not an
 *   exotic case, it is a three-year-old drumming with both hands, and Gyre plays a note
 *   per touch. Six voices peak at ~0.72 and cannot clip; the seventh is dropped, which
 *   is the right failure — a dropped note, not a bang.
 *
 *   AND AUDIO COULD OUTLIVE THE GAME. findings §8.6 rules that every cue "hard-stops
 *   itself via o.stop(t + dur) IN UNDER A SECOND — so nothing can outlive teardown, and
 *   §8.1's release guarantee is satisfiable." api.tone raised that ceiling to three
 *   seconds and recorded nothing, and endGameSession touched no audio at all, so a
 *   game's note could sing over the console after the child had left. §8.1 lists "media
 *   resource" among the things teardown must release. This registry is the handle that
 *   makes that guarantee structural instead of incidental, and it is why the sustain a
 *   lullaby needs can stay.
 *
 * THE CEILING IS 3000 Hz, NOT 4000. The old bound sat at the peak of the ear's
 * sensitivity, which made it the loudest-PERCEIVED note the primitive could produce —
 * the opposite of what a bound described as "a child's ears" is for. Gyre's own top
 * note is 2217 Hz, so nothing shipped is affected.
 *
 * The console's own twelve cues do NOT go through this. They are the shell's, they are
 * short, and they are not a game's to leak. */
var TONE_MAX_VOICES = 6;
var gameTones = [];
function playTone(hz, ms, wave) {
  var f = Number(hz), d = Number(ms);
  if (!isFinite(f) || !isFinite(d)) return;
  f = Math.min(3000, Math.max(40, f));
  d = Math.min(3000, Math.max(20, d));
  var w = TONE_WAVES.indexOf(wave) === -1 ? 'sine' : wave;
  /* PRUNED BY TIME, NOT BY `onended`, AND THAT DISTINCTION IS LOAD-BEARING. The first
   * version relied on the ended event alone. An AudioContext that has never had a user
   * gesture is SUSPENDED, its clock does not advance, and `onended` never fires — so the
   * registry filled to six and stayed full, and the toy went permanently silent instead
   * of being merely capped. Measured: 24 notes fired at once produced 2 voices, because
   * four dead entries were still holding slots. Every entry now carries the time it is
   * due to finish and is dropped when the context's own clock passes it; `onended` is
   * kept as well, because it is exact when it does fire. */
  /* WALL CLOCK, NOT THE AUDIO CLOCK. `currentTime` does not advance while the context
   * is SUSPENDED — which it is until the first user gesture — so pruning against it
   * expires nothing and the registry stays full, which is the same permanent silence
   * `onended` alone produced. Measured that way twice before the third version worked.
   * The wall clock always advances; a 50 ms grace covers scheduling slack. */
  var now = Date.now();
  for (var i = gameTones.length - 1; i >= 0; i--) { if (gameTones[i].until <= now) gameTones.splice(i, 1); }
  if (gameTones.length >= TONE_MAX_VOICES) return;
  var o = mk(f, d / 1000, w, 0, 0.12);
  if (!o) return;
  var rec = { o: o, until: now + d + 50 };
  gameTones.push(rec);
  o.onended = function() { var j = gameTones.indexOf(rec); if (j !== -1) gameTones.splice(j, 1); };
}

/* Called by endGameSession, and by nothing else. */
function stopGameTones() {
  for (var i = 0; i < gameTones.length; i++) { try { gameTones[i].o.stop(); } catch (e) {} }
  gameTones.length = 0;
}

function doSound(type) {
  try {
    var S = {
      ping:function(){mk(880,.08,'sine',0,.15);mk(1320,.12,'sine',.08,.12);mk(1760,.2,'sine',.16,.08)},
      chime:function(){mk(392,.3,'sine',0,.1);mk(523,.3,'sine',.1,.1);mk(659,.3,'sine',.2,.1);mk(784,.4,'sine',.3,.12)},
      scan:function(){sw(200,1800,.4,'sawtooth',0,.08);mk(1800,.15,'sine',.35,.06);mk(2200,.1,'sine',.42,.04)},
      alert:function(){mk(880,.08,'square',0,.1);mk(660,.08,'square',.1,.1);mk(880,.08,'square',.2,.1);mk(660,.08,'square',.3,.1);mk(880,.12,'square',.4,.08)},
      tap:function(){mk(3000,.02,'square',0,.15);mk(800,.08,'triangle',.02,.1);mk(1200,.15,'sine',.03,.06)},
      twinkle:function(){mk(1568,.12,'sine',0,.1);mk(1319,.12,'sine',.08,.1);mk(1047,.12,'sine',.16,.1);mk(1319,.12,'sine',.24,.08);mk(1568,.2,'sine',.32,.06)},
      blip:function(){mk(4000,.015,'square',0,.15);mk(2000,.03,'sine',.02,.1);sw(1500,800,.08,'sine',.05,.08);mk(1000,.06,'triangle',.12,.05)},
      powerUp:function(){sw(80,400,.3,'sawtooth',0,.08);sw(400,1200,.2,'sine',.2,.1);mk(1200,.15,'sine',.35,.12);mk(1600,.1,'sine',.4,.08);mk(2400,.3,'sine',.45,.06)},
      lock:function(){mk(600,.06,'sine',0,.1);mk(400,.12,'sine',.06,.1)},
      unlock:function(){mk(400,.06,'sine',0,.1);mk(600,.12,'sine',.06,.1)},
      keyTap:function(){mk(1800,.03,'sine',0,.08)},
      error:function(){mk(300,.08,'square',0,.1);mk(200,.15,'square',.1,.1)}
    };
    if(S[type])S[type]();
  } catch(e){}
}

/* === THE GAMES REGISTRY — PUP-WO-0200 §1.3 =================================
 * The shape is docs/findings/PUP-WO-0000.md §9.1 and this file DEFERS TO IT rather
 * than restating it: nine required fields, no optional ones, `id` unique per entry,
 * `module` a path that two entries may share (§9.3 — that is how one module ships two
 * board sizes). Two copies of a specification drift, and then one is wrong while both
 * look authoritative, which is architecture §6.1 member 4.
 *
 * Adding a game is meant to be a data change (northstar invariant 6): one module, one
 * entry here, one urlsToCache line. Roadmap P2 gate 2 measures exactly that with
 * `git diff --stat`, and a count is the evidence.
 *
 * `hello` is the placeholder PUP-WO-0200 §1.4 requires — a CONTRACT DEMONSTRATION,
 * not a game. It exists so gate 2 can be run and so games/ is non-empty, which check
 * 11 requires (it fails closed on an empty directory).
 */
/* GYRE IS FIRST, AND THAT ORDERING IS THE WHOLE OF THIS WORK ORDER'S UI DECISION.
 * The picker is PUP-WO-0201's and is not built here, so `openGames()` mounts
 * GAMES[0] — which means the position in this array IS what the Games button opens.
 * PUP-WO-0300 acceptance 8 requires "console -> games -> Gyre -> play -> back" on a
 * cold offline device, and a Gyre sitting second would be unreachable until the
 * picker ships: shipped, cached, and invisible to the child it was built for.
 * Reordering data is not building a chooser, so this does not cross into 0201.
 * `games/hello.js` STAYS AS A FILE AND IS NO LONGER A REGISTRY ENTRY (PUP-WO-0111 §3).
 * Scotty: "not needed now that we have at least 2 games behind the games tab." It is
 * still the contract demonstration checks 13 and 14 corrupt on purpose, and still the
 * live proof of mountControlPanel's FIRST guard — a module that publishes nothing gets
 * no panel and no error, which `blockpop` cannot demonstrate because it publishes a seam
 * and fails at the FOURTH guard instead. Different branches.
 *
 * The checks that need a tile for it PUSH THEIR OWN ENTRY (the precedent is
 * demo-picker.mjs's GAMES.push), which keeps their finger path end to end while Buddy
 * cannot see it BY CONSTRUCTION rather than by a filter that has to keep working. */
var GAMES=[
  {id:'gyre',module:'./games/gyre.js',label:'Gyre',icon:'\uD83C\uDF00',
   color:'#06B6D4',glow:'#67E8F9',sound:'twinkle',players:1,params:{}},
  {id:'blocks',module:'./games/blockpop.js',label:'Blocks',icon:'\uD83E\uDDF1',
   color:'#F59E0B',glow:'#FCD34D',sound:'blip',players:1,params:{mode:'easy'}}
];

var BLIPS=[
  {top:'28%',left:'60%',size:10,delay:4.35},
  {top:'42%',left:'24%',size:9,delay:2.74},
  {top:'68%',left:'65%',size:10,delay:0.70},
  {top:'55%',left:'36%',size:8,delay:2.23}
];

/* === State === */
var state = {active:null, pid:-1, pop:'', isLocked:false, storedPin:null};
var activeTimer = null;
var tpId = 0, xmId = 0;
var longPressTimer = null, longPressPos = null, didLongPress = false;
var LONG_PRESS_MS = 1000;
var X_MARK_DURATION = 5000;

/* === Alert Flash + Vibrate === */
var alertInterval = null;
function triggerAlertEffect() {
  if (alertInterval) clearInterval(alertInterval);
  var flash = document.getElementById('alertFlash');
  var on = true;
  var count = 0;
  var totalBlinks = 20;
  alertInterval = setInterval(function() {
    if (count >= totalBlinks) {
      clearInterval(alertInterval);
      alertInterval = null;
      if (flash) flash.style.opacity = '0';
      return;
    }
    if (on) {
      if (flash) flash.style.opacity = '0.35';
      try { navigator.vibrate(150); } catch(e) {}
    } else {
      if (flash) flash.style.opacity = '0';
    }
    on = !on;
    count++;
  }, 200);
}

/* === Supabase Sync === */
var supabaseUrl = '';
var supabaseKey = '';
var deviceId = '';
var pollTimer = null;
var lastFetchTime = 0;

function loadSupabaseConfig() {
  try {
    supabaseUrl = localStorage.getItem('puppad_sb_url') || '';
    supabaseKey = localStorage.getItem('puppad_sb_key') || '';
    deviceId = localStorage.getItem('puppad_device_id') || '';
    if (!deviceId) {
      deviceId = 'pp_' + Math.random().toString(36).substr(2, 9);
      localStorage.setItem('puppad_device_id', deviceId);
    }
  } catch(e) {}
}

function saveSupabaseConfig(url, key) {
  supabaseUrl = url.replace(/\/+$/, '');
  supabaseKey = key;
  try {
    localStorage.setItem('puppad_sb_url', supabaseUrl);
    localStorage.setItem('puppad_sb_key', supabaseKey);
  } catch(e) {}
  startPolling();
}

function isSupabaseConfigured() {
  return supabaseUrl && supabaseKey;
}

/* === THE INBOUND GATE — PUP-WO-0701 §S.2 ==================================
 * EVERY BYTE THAT ARRIVES FROM ANOTHER DEVICE PASSES THROUGH HERE BEFORE IT REACHES A
 * SINK. `PUP-WO-0700` closed the markup sink correctly — the URL is assigned, never
 * concatenated — AND THAT CLOSES INJECTION AND NOTHING ELSE. ASSIGNMENT STILL FETCHES:
 * `img.src = "https://attacker/x.png"` issues a request to an origin a stranger chose,
 * and so would `audio.src`. No script runs and nothing is stolen, and NORTHSTAR
 * INVARIANT 3 BREAKS ANYWAY, because a core surface reached the network on someone
 * else's say-so — a beacon confirming a child's device is live, from inside a toy whose
 * games are CI-enforced offline.
 *
 * VALIDATED AT THE SINK, NOT AT THE SENDER, because the sender is the untrusted party.
 * A check on the broadcasting side protects nobody: the attacker is the one broadcasting.
 *
 * THE BOUND IS NOW ONE-SIDED ON PURPOSE. It used to be the receiving half of a pair
 * whose sending half lived in the voice recorder; PUP-WO-0702 removed that transport, so
 * this bounds inbound PHOTOGRAPHS and nothing else. The base64 payload is measured as
 * characters, which over-counts the decoded size by ~4/3 — deliberately, because the cap
 * exists to bound MEMORY and the string is the thing held in memory. */
var MAX_INBOUND_BYTES = 3 * 1024 * 1024;

/* RENAMED AND NARROWED BY PUP-WO-0702, AND THE RENAME IS THE POINT.
 *
 * This was `safeMediaUrl(raw, kind)` with an `audio` branch built for the voice
 * transport. That transport is gone, so the branch had no caller — and A DEAD LIMB A
 * FUTURE READER TREATS AS LIVE IS WORSE THAN AN ABSENT ONE. This repo's own history is a
 * catalogue of things believed live that were not.
 *
 * THE `kind` PARAMETER WENT WITH IT, and so did the name. A function still called
 * `safeMediaUrl(raw)` that silently accepts only images is its own small trap: the next
 * caller passes audio, gets `''`, and has no clue why. `safeImageUrl` cannot be misread.
 *
 * If voice is ever networked again, THAT work order re-adds the audio branch AND its
 * check together, which is the correct coupling. */
function safeImageUrl(raw) {
  if (typeof raw !== 'string') return '';
  if (raw.length > MAX_INBOUND_BYTES) return '';
  /* Anchored, case-insensitive, and it must be a `data:` URL of an image.
   * Not a blocklist of schemes — a blocklist is a list of the ones someone thought of. */
  return /^data:image\/[a-z0-9.+-]+;base64,[A-Za-z0-9+/=]+$/i.test(raw) ? raw : '';
}

function supabaseFetch(path, method, body) {
  if (!isSupabaseConfigured()) return Promise.resolve(null);
  var opts = {
    method: method || 'GET',
    headers: {
      'apikey': supabaseKey,
      'Authorization': 'Bearer ' + supabaseKey,
      'Content-Type': 'application/json',
      'Prefer': method === 'POST' ? 'return=minimal' : ''
    }
  };
  if (body) opts.body = JSON.stringify(body);
  return fetch(supabaseUrl + '/rest/v1/' + path, opts).then(function(r) {
    if (method === 'POST') return null;
    return r.json();
  }).catch(function(e) { return null; });
}

function pushXMark(xPct, yPct) {
  if (!isSupabaseConfigured()) return;
  supabaseFetch('pup_pad_xmarks', 'POST', {
    x: xPct, y: yPct, device_id: deviceId,
    created_at: new Date().toISOString()
  });
}

function pushAlert() {
  if (!isSupabaseConfigured()) return;
  supabaseFetch('pup_pad_alerts', 'POST', {
    device_id: deviceId,
    created_at: new Date().toISOString()
  });
}

var lastAlertCheck = Date.now();
function fetchRemoteAlerts() {
  if (!isSupabaseConfigured()) return;
  var since = new Date(lastAlertCheck - 500).toISOString();
  supabaseFetch('pup_pad_alerts?device_id=neq.' + deviceId + '&created_at=gte.' + since + '&order=created_at.desc&limit=5', 'GET')

/* === ONE EXPRESSION, NOT FOUR — PUP-WO-0701 §S2.2 ==========================
 * `closeCamera` shipped the release discipline as five inline lines. Part 2 adds it to
 * canvas and map, and the voice panel adds a FOURTH channel — so the literal copy the
 * directive describes would leave four copies of one rule, in a project whose most
 * expensive recurring defect is TWO EXPRESSIONS THAT MUST AGREE. Four is worse.
 *
 * So the shape is preserved exactly (removeChannel, `.unsubscribe()` fallback in the
 * catch) and hoisted to one function every panel calls. NULLING THE HANDLE STAYS AT THE
 * CALL SITE: JS is pass-by-value, so a callee cannot clear its caller's variable — and a
 * helper that appeared to do so would be the worst kind of false green.
 *
 * WHICH CODE IS OLDER THAN THE RULE? That question is why canvas and map were missed.
 * A helper is the only answer that also covers the panel written NEXT. */
function releaseChannel(ch) {
  if (!ch) return;
  /* THE FALLBACK IS AN `else`, NOT A `catch`, AND THAT IS THE WHOLE DIFFERENCE.
   *
   * As a catch it only ran when `removeChannel` THREW. If the client were merely absent,
   * or the method missing -- a different supabase-js build, an offline client -- the `if`
   * was simply false, nothing released, and NOTHING THREW EITHER. Silent, and silent
   * across all four panels at once, since they now share this function. */
  var released = false;
  try {
    var c = getSupabaseClient();
    if (c && c.removeChannel) { c.removeChannel(ch); released = true; }
  } catch (e) { released = false; }
  if (!released) { try { ch.unsubscribe(); } catch (e2) {} }
}

function joinCanvasChannel() {
  var client = getSupabaseClient();
  if (!client) return;
  if (canvasChannel) return;
  canvasChannel = client.channel('puppad-canvas', {
    config: { broadcast: { self: false } }
  });
  canvasChannel.on('broadcast', { event: 'stroke' }, function(payload) {
    var d = payload.payload;
    drawRemoteStroke(d.x1, d.y1, d.x2, d.y2, d.color, d.width, d.eraser);
  });
  canvasChannel.on('broadcast', { event: 'stamp' }, function(payload) {
    var d = payload.payload;
    drawRemoteStamp(d.emoji, d.vx, d.vy, d.size);
  });
  canvasChannel.on('broadcast', { event: 'clear' }, function() {
    clearLocalCanvas();
  });
  canvasChannel.subscribe(function(status) {
    if (status === 'SUBSCRIBED') console.log('Canvas channel joined');
  });
}

function broadcastStroke(x1, y1, x2, y2, color, width, eraser) {
  if (!canvasChannel) return;
  canvasChannel.send({
    type: 'broadcast', event: 'stroke',
    payload: { x1:x1, y1:y1, x2:x2, y2:y2, color:color, width:width, eraser:!!eraser, did:deviceId }
  });
}

function broadcastStamp(emoji, vx, vy, size) {
  if (!canvasChannel) return;
  canvasChannel.send({
    type: 'broadcast', event: 'stamp',
    payload: { emoji:emoji, vx:vx, vy:vy, size:size, did:deviceId }
  });
}

function broadcastClear() {
  if (!canvasChannel) return;
  canvasChannel.send({ type: 'broadcast', event: 'clear', payload: { did:deviceId } });
}

/* === Virtual Canvas Coordinate System === */
var VCANVAS_W = 1600;
var VCANVAS_H = 900;
var canvasMapping = null;

function calcMapping(cvs) {
  var rect = cvs.getBoundingClientRect();
  var sw = rect.width, sh = rect.height;
  var baseScale = Math.min(sw / VCANVAS_W, sh / VCANVAS_H);
  var scale = baseScale * zoomLevel;
  var ox = sw / 2 - (VCANVAS_W / 2) * scale;
  var oy = sh / 2 - (VCANVAS_H / 2) * scale;
  canvasMapping = { scale:scale, ox:ox, oy:oy, sw:sw, sh:sh };
  return canvasMapping;
}

function screenToVirtual(sx, sy) {
  var m = canvasMapping;
  if (!m) return {x:0, y:0};
  return { x:(sx - m.ox) / m.scale, y:(sy - m.oy) / m.scale };
}

function virtualToScreen(vx, vy) {
  var m = canvasMapping;
  if (!m) return {x:0, y:0};
  return { x: vx * m.scale + m.ox, y: vy * m.scale + m.oy };
}

function scaledWidth(vw) {
  return canvasMapping ? vw * canvasMapping.scale : vw;
}

/* === Drawing Primitives === */
function drawStrokeOnCanvas(ctx, vx1, vy1, vx2, vy2, color, vwidth, eraser) {
  var p1 = virtualToScreen(vx1, vy1);
  var p2 = virtualToScreen(vx2, vy2);
  ctx.save();
  if (eraser) {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.strokeStyle = 'rgba(255,255,255,1)';
  } else {
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = color;
  }
  ctx.lineWidth = scaledWidth(eraser ? vwidth * 3 : vwidth);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(p1.x, p1.y);
  ctx.lineTo(p2.x, p2.y);
  ctx.stroke();
  ctx.restore();
}

function drawStampOnCanvas(ctx, emoji, vx, vy, vsize) {
  var p = virtualToScreen(vx, vy);
  var sz = scaledWidth(vsize);
  ctx.font = sz + 'px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(emoji, p.x, p.y);
}

function drawRemoteStroke(x1, y1, x2, y2, color, width, eraser) {
  var cvs = document.getElementById('drawCanvas');
  if (!cvs || !canvasMapping) return;
  drawStrokeOnCanvas(cvs.getContext('2d'), x1, y1, x2, y2, color, width, eraser);
}

function drawRemoteStamp(emoji, vx, vy, size) {
  var cvs = document.getElementById('drawCanvas');
  if (!cvs || !canvasMapping) return;
  drawStampOnCanvas(cvs.getContext('2d'), emoji, vx, vy, size);
}

function clearLocalCanvas() {
  var cvs = document.getElementById('drawCanvas');
  if (!cvs) return;
  cvs.getContext('2d').clearRect(0, 0, cvs.width, cvs.height);
}

/* === Rainbow Color Helper === */
function hslToHex(h) {
  var s = 85, l = 60;
  var c = (1 - Math.abs(2*l/100 - 1)) * s/100;
  var x = c * (1 - Math.abs((h/60)%2 - 1));
  var m = l/100 - c/2;
  var r=0,g=0,b=0;
  if(h<60){r=c;g=x}else if(h<120){r=x;g=c}else if(h<180){g=c;b=x}
  else if(h<240){g=x;b=c}else if(h<300){r=x;b=c}else{r=c;b=x}
  r=Math.round((r+m)*255);g=Math.round((g+m)*255);b=Math.round((b+m)*255);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

/* === Zoom Helper === */
function applyZoom(cvs, ctx, strokes) {
  calcMapping(cvs);
  ctx.clearRect(0, 0, cvs.width, cvs.height);
  strokes.forEach(function(s) {
    if (s.type === 'stroke') drawStrokeOnCanvas(ctx, s.x1, s.y1, s.x2, s.y2, s.color, s.width, s.eraser);
    else if (s.type === 'stamp') drawStampOnCanvas(ctx, s.emoji, s.vx, s.vy, s.size);
  });
}

/* === Camera System === */
var cameraChannel = null;
var cameraStream = null;
/* === §1.0a's FIRST INSTANCE — PUP-WO-0701 §S.4 ============================
 * `cameraGallery` is a plain in-memory array persisted nowhere, and `closeCamera()`
 * empties it — so photos already die with the panel, which is the shape §1.0a ruled.
 * WHAT IT DID NOT HAVE WAS A BOUND. "Until the panel closes" is not a limit anyone
 * chose, and within one session an unbounded array of base64 JPEGs grows the JS heap on
 * a low-end phone. CAPTURE made that worse by pushing INBOUND bytes into it — an
 * unbounded in-memory store on the trust boundary, fed by a stranger.
 *
 * A DESIGNED BOUND WHERE THERE WAS A LUCKY ONE: capped count, OLDEST EVICTED, released
 * on close. One function so the two push sites cannot drift apart — they are two
 * expressions of one rule, which is this project's most expensive recurring class. */
var GALLERY_MAX = 24;
var cameraGallery = [];

function galleryPush(url) {
  cameraGallery.push(url);
  while (cameraGallery.length > GALLERY_MAX) cameraGallery.shift();
}

/* ============ THE STICKER'S SIZE — PUP-WO-0700 §1 =========================
 * A STICKER IS A FRACTION OF THE IMAGE'S WIDTH, AND THERE IS ONE OF IT.
 *
 * The defect Scotty found on the device — "stickers don't stay anchored once it
 * converts to the smaller size" — was NOT a placement bug. Position is proportional in
 * both paths and was always correct: the preview writes `left:xPct% top:yPct%` and the
 * burn computes `xPct/100*w`. SIZE was proportional in only ONE of them. The preview
 * hardcoded `font-size:36px`; the burn computed `Math.round(w * 0.06)`. Those agree
 * only where `w * 0.06 ≈ 36` — at a rendered width of about 600px — and diverge
 * everywhere else. A differently-sized emoji centred on the same point covers different
 * content, which is exactly what "not anchored" looks like to someone holding it.
 *
 * TWO EXPRESSIONS THAT MUST AGREE IS THE MOST EXPENSIVE RECURRING SHAPE IN THIS
 * PROJECT. Replacing one hardcoded number with a second matching hardcoded number would
 * reproduce it at the next change, so the fraction lives here once and BOTH paths call
 * this function — the preview with the sticker layer's rendered width, the burn with the
 * canvas's. Whichever width is in play, the sticker is the same fraction of it.
 *
 * A BARE GREP DOES NOT PROVE IT, and an earlier version of this comment claimed it did.
 * `grep -n '0\.06\|36px' index.html` returns fourteen lines here — eight `rgba(...,0.06)`
 * alpha values and a live, unrelated `36px` on the camera panel's placeholder icon. The
 * claim was checkable, was checked by an adversarial pass, and was false. What can be
 * proved is structural and check 20 asserts it: this fraction is declared exactly once,
 * and both the preview and the burn are matched as reaching it through stickerFontPx. */
var STICKER_W_FRAC = 0.06;
function stickerFontPx(width) {
  var w = Number(width);
  if (!isFinite(w) || w <= 0) return 0;
  return w * STICKER_W_FRAC;
}

/* ============ WHERE THE PHOTO ACTUALLY IS — and the first fix was wrong ====
 * THE FRACTION WAS NEVER THE WHOLE PROBLEM. Removing the second CONSTANT left a second
 * ANSWER: `#camReviewCanvas` is `width:100%;height:100%;object-fit:contain` and
 * `#camStickerLayer` is `inset:0` over the SAME box — so the layer is the ELEMENT box
 * and the photo is letterboxed inside it. Sizing the preview at 6% of the layer and the
 * burn at 6% of the canvas is the same fraction OF TWO DIFFERENT RECTANGLES.
 *
 * Measured by an adversarial pass on the first fix, one sticker, canvas 3840x2160:
 *   1024x640  layer 1024x552, photo 981x552   -> on screen 61.4px vs 58.8px   -4.3%
 *   1366x768  layer 1366x680, photo 1209x680  -> 82.0 vs 72.4                -11.7%
 *   2400x1080 layer 2400x992, photo 1764x992  -> 144 vs 105.6                -26.7%
 *   1920x500  layer 1920x412, photo  732x412  -> 115.2 vs 43.9               -61.9%
 * POSITION DRIFTS BY THE SAME MECHANISM — up to 214px, 29% of the photo width — which
 * means the work order's "position is proportional in both paths and was never wrong"
 * is false whenever the image is letterboxed, and it is letterboxed at most sizes.
 *
 * So there is ONE more thing that has to be said once: WHERE THE PHOTO IS. Everything
 * the child places is a fraction OF THE PHOTO, in both paths, and the layer is only a
 * surface to draw the preview on. `contain` scales by the smaller ratio and centres. */
function photoBoxIn(layer, canvas) {
  var r = layer.getBoundingClientRect();
  var iw = canvas ? canvas.width : 0, ih = canvas ? canvas.height : 0;
  if (!iw || !ih || !r.width || !r.height) return { x: 0, y: 0, w: r.width, h: r.height };
  var scale = Math.min(r.width / iw, r.height / ih);
  var w = iw * scale, h = ih * scale;
  return { x: (r.width - w) / 2, y: (r.height - h) / 2, w: w, h: h };
}

/* The preview's geometry, in one place, RE-RUNNABLE. It was computed once at placement
 * and never again, so a window resize between placing a sticker and pressing DONE left
 * the preview 1.72 percentage points from the burn — 8.6x the tolerance the check
 * enforces — and the sticker visibly jumped on save. */
function layoutStickerEl(el, s, layer, canvas) {
  var box = photoBoxIn(layer, canvas);
  el.style.left = (box.x + box.w * (s.xPct / 100)) + 'px';
  el.style.top = (box.y + box.h * (s.yPct / 100)) + 'px';
  el.style.fontSize = stickerFontPx(box.w) + 'px';
}

var cameraFacing = 'environment';
var cameraSticker = null;
var cameraReviewCanvas = null;

var CAMERA_FILTERS = [
  {name:'Normal',css:'none',icon:'\u25CB'},
  {name:'B&W',css:'grayscale(100%)',icon:'\u25C9'},
  {name:'Sepia',css:'sepia(100%)',icon:'\uD83C\uDF3E'},
  {name:'Invert',css:'invert(100%)',icon:'\uD83D\uDD03'},
  {name:'Vivid',css:'saturate(300%)',icon:'\uD83C\uDF1F'},
  {name:'Alien',css:'hue-rotate(90deg)',icon:'\uD83D\uDC7D'},
  {name:'Purple',css:'hue-rotate(270deg)',icon:'\uD83D\uDC9C'},
  {name:'Cool',css:'hue-rotate(180deg) saturate(150%)',icon:'\u2744\uFE0F'}
];

function joinCameraChannel() {
  var client = getSupabaseClient();
  if (!client) return;
  if (cameraChannel) return;
  cameraChannel = client.channel('puppad-camera', {
    config: { broadcast: { self: false } }
  });
  cameraChannel.on('broadcast', { event: 'photo' }, function(payload) {
    /* THE FIRST THING DONE WITH AN INBOUND BYTE, BEFORE IT REACHES ANY SINK. The old
     * line handed payload.payload.dataUrl straight through with no type, scheme or size
     * check at all. */
    var url = safeImageUrl(payload && payload.payload && payload.payload.dataUrl);
    if (!url) return;
    showRemotePhoto(url);
  });
  cameraChannel.subscribe(function(status) {
    if (status === 'SUBSCRIBED') console.log('Camera channel joined');
  });
}

function broadcastPhoto(dataUrl) {
  if (!cameraChannel) return;
  cameraChannel.send({
    type: 'broadcast', event: 'photo',
    payload: { dataUrl: dataUrl, did: deviceId }
  });
}

function showRemotePhoto(dataUrl) {
  var popup = document.createElement('div');
  popup.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:200;border-radius:16px;overflow:hidden;box-shadow:0 0 30px rgba(236,72,153,0.4),0 0 0 2px rgba(236,72,153,0.3);animation:fadeUp 0.3s ease-out';
  popup.innerHTML = '<div style="background:#1a1a2e;padding:6px">'
    +'<div style="display:flex;align-items:center;gap:6px;padding:4px 8px">'
    +pawSVG(12,'#F472B6')
    +'<span style="color:#F472B6;font-size:10px;font-weight:700">INCOMING SNAP</span>'
    +'</div>'
    +'<img id="snapIncomingImg" style="display:block;border-radius:10px;max-width:260px;max-height:200px"/>'
    +'</div>';
  /* THE URL IS ASSIGNED, NEVER CONCATENATED. This built `'<img src="'+dataUrl+'"…'` into
   * innerHTML, and `dataUrl` arrives verbatim from a broadcast payload — so a payload of
   *   x" onerror="…" data-z="
   * closed the attribute and ran script in the child's app. PUP-WO-0700 made that worse
   * before it made it better: CAPTURE stores the string, and renderGallery and
   * showGalleryFull concatenate it the same way, so one payload reached THREE sinks and
   * outlived the four-second popup instead of dying with it.
   *
   * This project has already ruled this class dangerous and closed it elsewhere — the
   * picker's tiles use textContent, and PUP-WO-0201's pass recorded `<img onerror>` as
   * harmless there FOR THAT REASON. Setting the property cannot escape an attribute
   * because there is no attribute to escape. */
  var incoming = popup.querySelector('#snapIncomingImg');
  if (incoming) incoming.src = dataUrl;

  /* ============ CAPTURE — PUP-WO-0700 §2 ================================
   * WHAT "ITS OWN GALLERY" MEANS HERE, RULED BEFORE THE BUTTON WAS BUILT because §2
   * says it is not obvious and it is not. `cameraGallery` is a plain in-memory array
   * persisted nowhere, and `closeCamera()` empties it — so a captured snap lives until
   * the camera panel is next closed and no longer.
   *
   * THAT IS THE RIGHT STORE, and the reason is what this button replaces rather than
   * what it achieves: TODAY AN INCOMING SNAP IS GONE IN FOUR SECONDS. The popup fades
   * itself and there is no way to keep it. "Until you close the camera" is an enormous
   * improvement on "four seconds" for a child looking at a picture someone just sent,
   * and it is STRICTER than the retention PUP-WO-0701 §1.0a ruled for this app.
   * (Precisely, because the draft of this comment got it wrong and the correction
   * reached the feedback doc and not this line: §1.0a rules SESSION-scoped —
   * "everything is reaped on PWA close or reset" — and a store closeCamera() empties
   * dies sooner than that. The "cache-only… because kids" quote is §1, not §1.0a.)
   * In-memory, never localStorage either way. Making it outlive the
   * panel would be a different decision with a different risk, and §2 makes that a
   * flag-and-stop rather than a quiet setItem. It is not made here.
   *
   * THE FADE TIMER IS CANCELLED ON PRESS. A four-second window is not long for a
   * three-year-old to notice a button, decide, and aim at it — and a control that
   * disappears mid-reach is a control that punishes hesitation. */
  var fadeTimer = null;
  var cap = document.createElement('div');
  cap.id = 'snapCaptureBtn';
  /* The gallery's own affordance language — a pill at the corner of the surface, the
   * same shape as .gClose — rather than a new control vocabulary for one button. */
  cap.style.cssText = 'position:absolute;top:2px;right:6px;z-index:5;width:38px;height:38px;'
    + 'display:flex;align-items:center;justify-content:center;border-radius:10px;'
    + 'background:rgba(255,255,255,0.12);border:2px solid rgba(244,114,182,0.55);'
    + 'font-size:19px;line-height:1;cursor:pointer;touch-action:manipulation;'
    + '-webkit-tap-highlight-color:transparent';
  cap.setAttribute('role', 'button');
  cap.setAttribute('aria-label', 'Keep this photo');
  /* An arrow INTO a tray, against RESHARE's arrow out of one — the same in-versus-out
   * pairing the game panel's attract/repel control uses, so a child who has learned one
   * has learned both. No word is painted. */
  cap.textContent = '\uD83D\uDCE5';
  popup.appendChild(cap);
  wireTap(cap, function() {
    /* The same gate shape as every other Supabase call site. It cannot fire here — this
     * popup only exists because a broadcast arrived — and it is kept because a guard
     * that is unreachable by construction today is reachable the moment someone calls
     * showRemotePhoto from somewhere else. Noted in the feedback rather than left to
     * look like an oversight. */
    if (!isSupabaseConfigured()) return;
    if (cap.dataset.done) return;
    /* WHAT IS KEPT MUST BE AN IMAGE. Without this, `data:text/plain,hello`, a truncated
     * base64 string, an empty string and a `javascript:` URL were all stored and all
     * flipped this button to a tick — the toy telling a child it kept something it did
     * not. Downstream, RESHARE on such an entry is painted, pressable, and silently does
     * nothing forever, which is the "control that lies" this shell refuses elsewhere.
     * The bytes come off a broadcast channel, so the check belongs at the point of
     * storage rather than at each of the three places that later draw it. */
    if (!/^data:image\/(png|jpeg|jpg|gif|webp);base64,[A-Za-z0-9+/=]+$/.test(String(dataUrl))) {
      if (window.console && console.warn) console.warn('[camera] refused to keep a broadcast payload that is not an image');
      cap.textContent = '\u2715';
      cap.style.borderColor = '#F87171';
      return;
    }
    cap.dataset.done = '1';
    galleryPush(dataUrl);
    if (typeof window.renderCameraGallery === 'function') {
      try { window.renderCameraGallery(); } catch (e) {}
    }
    cap.textContent = '\u2713';
    cap.style.background = 'rgba(52,211,153,0.25)';
    cap.style.borderColor = '#34D399';
    try { doSound('ping'); } catch (e) {}
    if (fadeTimer) { clearTimeout(fadeTimer); fadeTimer = null; }
    fadeTimer = setTimeout(fade, 1200);
  });

  document.body.appendChild(popup);
  doSound('ping');
  function fade() {
    popup.style.transition = 'opacity 0.5s';
    popup.style.opacity = '0';
    setTimeout(function() { if (popup.parentNode) popup.parentNode.removeChild(popup); }, 600);
  }
  fadeTimer = setTimeout(fade, 4000);
}

function compressForBroadcast(sourceCanvas) {
  var tmp = document.createElement('canvas');
  var maxW = 600;
  var ratio = sourceCanvas.height / sourceCanvas.width;
  tmp.width = maxW;
  tmp.height = Math.round(maxW * ratio);
  tmp.getContext('2d').drawImage(sourceCanvas, 0, 0, tmp.width, tmp.height);
  return tmp.toDataURL('image/jpeg', 0.7);
}

function startCameraStream(video, facing) {
  if (cameraStream) {
    cameraStream.getTracks().forEach(function(t) { t.stop(); });
  }
  /* cascading fallback: try max res, then medium, then basic, then bare minimum */
  var attempts = [
    { video: { facingMode: facing, width: { ideal: 4032 }, height: { ideal: 3024 } }, audio: false },
    { video: { facingMode: facing, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false },
    { video: { facingMode: facing }, audio: false },
    { video: true, audio: false }
  ];
  var firstError = null;
  function tryNext(i) {
    if (i >= attempts.length) return Promise.reject(firstError || new Error('No camera available'));
    return navigator.mediaDevices.getUserMedia(attempts[i]).then(function(stream) {
      cameraStream = stream;
      video.srcObject = stream;
      return video.play();
    }).catch(function(e) {
      if (!firstError) firstError = e;
      /* only retry on constraint errors — permission/hardware errors won't improve */
      if (e.name === 'OverconstrainedError' || e.name === 'ConstraintNotSatisfiedError') {
        return tryNext(i + 1);
      }
      return Promise.reject(e);
    });
  }
  return tryNext(0);
}

function openCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    state.pop = 'Camera not supported!';
    updateUI(); return;
  }

  cameraFilter = 'none';
  cameraFacing = 'environment';
  cameraSticker = null;
  joinCameraChannel();
  doSound('blip');

  var overlay = document.createElement('div');
  overlay.id = 'cameraOverlay';
  /* touch-action:none — PUP-WO-0603 §2, DEFENCE IN DEPTH AND NOT THE FIX. A full-bleed
   * positioned container that never scrolls. It was measured NOT to change zoom
   * behaviour: `:17`'s root declaration already blocks a document-level pinch whatever
   * this computes. It is here because `:17` is one line in a file that changes
   * constantly, not because it was shown to stop anything. Its two horizontal strips
   * carry their own pan-x and touch-action does not inherit, so they keep their gesture. */
  overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#070D18;z-index:80;display:flex;flex-direction:column;font-family:Trebuchet MS,sans-serif;touch-action:none';

    filterBtns += '<div class="filter-pick" data-idx="'+i+'" style="display:flex;flex-direction:column;align-items:center;gap:1px;padding:2px 6px;border-radius:6px;cursor:pointer;background:'+(f.css===cameraFilter?'rgba(236,72,153,0.2)':'rgba(255,255,255,0.04)')+';transition:all 0.15s">'
      +'<span style="font-size:14px">'+f.icon+'</span>'
      +'<span style="font-size:8px;color:'+(f.css===cameraFilter?'#F472B6':'rgba(148,197,255,0.4)')+';font-weight:700">'+f.name+'</span>'
      +'</div>';
  });

  var topBar = '<div style="display:flex;align-items:center;justify-content:space-between;padding:5px 10px;background:rgba(255,255,255,0.03)">'
    +'<div style="display:flex;align-items:center;gap:6px">'
    +pawSVG(14,'#F472B6')
    +'<span style="color:#F472B6;font-size:11px;font-weight:700;letter-spacing:1px">PAW CAM</span>'
    +'</div>'
    +'<div style="display:flex;gap:3px;align-items:center;overflow-x:auto;touch-action:pan-x;flex:1;margin:0 8px">'+filterBtns+'</div>'
    +'<div style="display:flex;gap:6px;align-items:center;flex-shrink:0">'
    +'<div id="camFlipBtn" style="font-size:18px;cursor:pointer;padding:2px 6px;border-radius:6px;background:rgba(255,255,255,0.06)">\uD83D\uDD04</div>'
    +'<div id="camCloseBtn" style="color:rgba(148,197,255,0.5);font-size:11px;font-weight:700;padding:4px 10px;border-radius:8px;background:rgba(255,255,255,0.06);cursor:pointer">CLOSE</div>'
    +'</div></div>';

  /* viewfinder area */
  var viewfinder = '<div id="camViewArea" style="flex:1;position:relative;overflow:hidden;background:#000">'
    +'<video id="camVideo" autoplay playsinline muted style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover"></video>'
    +'<canvas id="camReviewCanvas" style="display:none;position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;touch-action:none"></canvas>'
    +'<div id="camFlash" style="position:absolute;top:0;left:0;right:0;bottom:0;background:#fff;opacity:0;pointer-events:none;transition:opacity 0.15s;z-index:2"></div>'
    +'<div id="camStickerLayer" style="display:none;position:absolute;top:0;left:0;right:0;bottom:0;z-index:3;touch-action:none"></div>'
    +'</div>';

  /* bottom bar: gallery + shutter */
  var bottomBar = '<div style="display:flex;align-items:center;padding:6px 10px;background:rgba(255,255,255,0.03);gap:8px">'
    +'<div id="camGalleryStrip" style="display:flex;gap:6px;align-items:center;flex:1;overflow-x:auto;touch-action:pan-x;min-height:68px"></div>'
    +'<div id="camStickerBar" style="display:none;gap:4px;align-items:center;flex:1;overflow-x:auto;touch-action:pan-x"></div>'
    +'<div style="display:flex;gap:6px;align-items:center;flex-shrink:0">'
    +'<div id="camRetakeBtn" style="display:none;color:#93C5FD;font-size:10px;font-weight:700;padding:4px 10px;border-radius:8px;background:rgba(96,165,250,0.1);cursor:pointer">RETAKE</div>'
    +'<div id="camSaveBtn" style="display:none;color:#34D399;font-size:10px;font-weight:700;padding:4px 10px;border-radius:8px;background:rgba(52,211,153,0.1);cursor:pointer">DONE</div>'
    +'<div id="camShutterBtn" style="width:48px;height:48px;border-radius:50%;background:radial-gradient(circle,#F472B6,#EC4899);box-shadow:0 0 0 3px rgba(236,72,153,0.3),0 4px 12px rgba(0,0,0,0.5);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0">'
    +'<div style="width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,0.4)"></div>'
    +'</div>'
    +'</div></div>';

  overlay.innerHTML = topBar + viewfinder + bottomBar;
  document.body.appendChild(overlay);

  /* populate sticker bar */
  var stickerBar = document.getElementById('camStickerBar');
  STAMP_EMOJIS.forEach(function(em) {

    el.className = 'cam-sticker-pick';
    el.dataset.emoji = em;
    el.textContent = em;
    el.style.cssText = 'font-size:24px;cursor:pointer;padding:2px 4px;border-radius:6px;background:transparent;border:2px solid transparent;flex-shrink:0;transition:all 0.15s';
    stickerBar.appendChild(el);
  });

  var video = document.getElementById('camVideo');
  var reviewCanvas = document.getElementById('camReviewCanvas');
  var reviewMode = false;
  var reviewStickers = [];
  /* THE PREVIEW IS RE-LAID-OUT WHEN ITS BOX CHANGES. It was computed once at placement,
   * so a resize between placing a sticker and pressing DONE left the preview showing one
   * size and the burn producing another — and the sticker visibly jumped on save. The
   * observer is disconnected in closeCamera beside everything else the panel holds. */
  window.__camStickerRO = (typeof ResizeObserver === 'function') ? new ResizeObserver(function() {
    var layer = document.getElementById('camStickerLayer');
    var canvas = document.getElementById('camReviewCanvas');
    if (!layer || !canvas) return;
    for (var i = 0; i < layer.children.length; i++) {
      var c = layer.children[i];
      if (c.__sticker) layoutStickerEl(c, c.__sticker, layer, canvas);
    }
  }) : null;

  /* start camera */
  startCameraStream(video, cameraFacing).catch(function(e) {
    console.log('Camera error:', e);
    /* show diagnostic error on screen */
    var viewArea = document.getElementById('camViewArea');
    if (viewArea) {
      viewArea.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;padding:20px">'
        +'<div style="font-size:36px">\uD83D\uDCF7</div>'

        +'<div style="color:rgba(148,197,255,0.35);font-size:10px;text-align:center;max-width:280px">Check: Android Settings → Apps → Chrome → Permissions → Camera → Allow. Then tap Retry.</div>'
        +'<div id="camRetryBtn2" style="color:#34D399;font-size:12px;font-weight:700;padding:8px 24px;border-radius:10px;background:rgba(52,211,153,0.15);cursor:pointer;margin-top:8px">RETRY</div>'
        +'</div>';
