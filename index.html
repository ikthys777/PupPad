/* === PIN Overlay === */
function showPinOverlay(mode) {
  var entry = '', confirm = '', step = 'enter', error = '';
  function getTitle() {
    if (mode === 'set') return step === 'enter' ? 'Set a 4-digit PIN' : 'Confirm your PIN';
    return 'Enter PIN to unlock';
  }
  function renderDots(val) {
    var h = '';
    for (var i = 0; i < 4; i++) {
      var filled = i < val.length;
      h += '<div style="width:16px;height:16px;border-radius:50%;background:'+(filled?'#60A5FA':'transparent')+';border:2px solid '+(filled?'#60A5FA':'rgba(148,197,255,0.3)')+';box-shadow:'+(filled?'0 0 8px #60A5FA66':'none')+';transition:all 0.15s"></div>';
    }
    return h;
  }
  function buildOverlay() {
    var currentVal = step === 'confirm' ? confirm : entry;
    var overlay = document.getElementById('pinOverlay');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.id = 'pinOverlay';
      overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.92);display:flex;align-items:center;justify-content:center;z-index:100;font-family:Trebuchet MS,sans-serif';
      document.body.appendChild(overlay);
    }
    overlay.innerHTML = '<div style="background:linear-gradient(180deg,#1a2a4a,#0f1d3a);border-radius:24px;padding:24px 28px;width:280px;box-shadow:0 0 0 2px rgba(37,99,235,0.2),0 20px 40px rgba(0,0,0,0.6);display:flex;flex-direction:column;align-items:center;gap:16px">'
      +'<div style="display:flex;align-items:center;gap:8px">'+lockSVG(20,'#60A5FA',mode==='unlock')+'<span style="color:#93C5FD;font-size:14px;font-weight:700">'+getTitle()+'</span></div>'
      +(error ? '<span style="color:#F87171;font-size:11px;font-weight:600">'+error+'</span>' : '')
      +'<div style="display:flex;gap:12px">'+renderDots(currentVal)+'</div>'
      +'<div id="pinPad" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%"></div>'
      +'<div id="pinCancel" style="color:rgba(148,197,255,0.45);font-size:11px;font-weight:600;cursor:pointer;padding:4px 12px">Cancel</div>'
      +'</div>';
    var pad = document.getElementById('pinPad');
    ['1','2','3','4','5','6','7','8','9','','0','del'].forEach(function(k) {
      if (k === '') { var sp = document.createElement('div'); pad.appendChild(sp); return; }
      var isDel = k === 'del';
      var btn = document.createElement('div');
      btn.textContent = isDel ? 'DEL' : k;
      btn.style.cssText = 'display:flex;align-items:center;justify-content:center;height:44px;border-radius:10px;cursor:pointer;background:'+(isDel?'rgba(239,68,68,0.15)':'rgba(255,255,255,0.06)')+';color:'+(isDel?'#F87171':'#CBD5E1')+';font-size:'+(isDel?'12':'18')+'px;font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,0.05),0 2px 4px rgba(0,0,0,0.3)';
      btn.addEventListener('click', function() {
        doSound('keyTap');
        if (isDel) {
          if (step === 'confirm') confirm = confirm.slice(0,-1);
          else entry = entry.slice(0,-1);
          error = '';
          buildOverlay();
          return;
        }
        if (step === 'confirm') {
          if (confirm.length >= 4) return;
          confirm += k;
          if (confirm.length === 4) {
            if (confirm === entry) { closePinOverlay(); onPinComplete(confirm); }
            else { doSound('error'); error = "PINs don't match. Try again."; entry = ''; confirm = ''; step = 'enter'; }
          }
        } else {
          if (entry.length >= 4) return;
          entry += k;
          if (entry.length === 4) {
            if (mode === 'set') { step = 'confirm'; }
            else { closePinOverlay(); onPinComplete(entry); }
          }
        }
        buildOverlay();
      });
      pad.appendChild(btn);
    });
    document.getElementById('pinCancel').addEventListener('click', closePinOverlay);
  }
  function onPinComplete(pin) {
    if (mode === 'set') {
      state.storedPin = pin; state.isLocked = true;
      doSound('lock'); goFullscreen(); render();
    } else {
      if (pin === state.storedPin) {
        state.isLocked = false; state.storedPin = null;
        doSound('unlock'); exitFullscreen(); render();
      } else { doSound('error'); render(); }
    }
  }
  buildOverlay();
}
function closePinOverlay() {
  var overlay = document.getElementById('pinOverlay');
  if (overlay) overlay.parentNode.removeChild(overlay);
}

/* === THE ZOOM LOCKOUT'S WAY BACK — PUP-WO-0603 §3 ==========================
 * A PAGE CANNOT RESET ITS OWN ZOOM. There is no API, and pretending otherwise is how
 * this ships looking fixed. What it CAN do is notice that the visual viewport has been
 * panned away from the origin while zoomed, and bring it home — and BOTH ways out live
 * at the top-left (`#gameBack` and `#pickerBack` are `left:max(10px,env(safe-area-inset-left))`
 * at `top:calc(... + 52px)`), so the origin IS where the exit is. That satisfies
 * northstar invariant 5 with the capability the platform actually gives us: the page
 * stays zoomed, and the way out is back under the child's thumb.
 *
 * WHY IT ONLY ACTS WHEN THE VIEWPORT HAS BEEN PANNED, AND NOT ON EVERY ZOOM.
 * A zoomed page whose origin is still on screen is not a lockout — the exit is visible
 * and the tap exists. Snapping home in that case would fight an adult who deliberately
 * zoomed to look at something, for no gain to the child. So the trigger is the LOCKOUT
 * CONDITION, not the zoom: scaled up AND panned off the origin.
 *
 * AND IT IS DEBOUNCED, because the alternative is unusable. `scrollTo` on every
 * `visualViewport` scroll event would cancel a pan mid-gesture and make a zoomed page
 * impossible to move at all. 500ms after the last movement is long enough that a
 * deliberate adult pan completes and short enough that a stuck child is not stuck.
 *
 * WHAT THIS CANNOT SEE, STATED BECAUSE A LIMIT LEFT UNSAID READS AS COVERAGE:
 * `visualViewport.scale` reports PAGE zoom. Android's system MAGNIFICATION accessibility
 * gesture magnifies the screen outside the page entirely — scale stays 1, no event
 * fires, and nothing here can run. If a device is magnifying rather than zooming, this
 * path is silent by construction and the remedy is an Android setting, not a commit. */
function installZoomRecovery() {
  var vv = window.visualViewport;
  if (!vv) return null;
  var timer = 0;
  /* Not a constant shared with anything: it is a settle window for a human hand, and it
   * is the only place it appears. */
  var SETTLE_MS = 500;

  function lockedOut() {
    /* 1.01 rather than 1: scale is a float and pinch-to-1 lands on 1.0000001. */
    if (!(vv.scale > 1.01)) return false;
    return vv.offsetLeft > 1 || vv.offsetTop > 1 || (window.pageXOffset || 0) > 1 || (window.pageYOffset || 0) > 1;
  }

  function goHome() {
    timer = 0;
    if (!lockedOut()) return;
    try { window.scrollTo(0, 0); } catch (e) {}
    /* documentElement/body as well, because which one scrolls depends on the mode the
     * document is in and this must not depend on guessing right. */
    try { document.documentElement.scrollLeft = 0; document.documentElement.scrollTop = 0; } catch (e) {}
    try { document.body.scrollLeft = 0; document.body.scrollTop = 0; } catch (e) {}
  }

  function schedule() {
    if (!lockedOut()) { if (timer) { clearTimeout(timer); timer = 0; } return; }
    if (timer) clearTimeout(timer);
    timer = setTimeout(goHome, SETTLE_MS);
  }

  vv.addEventListener('resize', schedule);
  vv.addEventListener('scroll', schedule);
  /* Exposed so a check can drive it without waiting out the settle window, and so this
   * is observable at all — a recovery path with no handle is one nothing can assert. */
  window.__zoomRecovery = { schedule: schedule, goHome: goHome, lockedOut: lockedOut, settleMs: SETTLE_MS };
  return window.__zoomRecovery;
}

/* === THE MULTI-TOUCH GUARD — PUP-WO-0603 §2 ================================
 * A THREE-YEAR-OLD ALWAYS HAS A SECOND CONTACT. His palm rests, his other hand arrives,
 * and a one-finger press becomes a two-finger gesture the browser is entitled to read as
 * a pinch. This cancels the browser's default for a multi-touch that begins on a surface
 * that has nothing to scroll.
 *
 * IT IS NOT A BLANKET document-level preventDefault, WHICH §5 NAMES AS A FLAG-AND-STOP.
 * The listener is document-level because panels are built and destroyed at runtime and a
 * per-element listener would miss whichever one is added next — but it acts ONLY when
 * the touch began outside every scrollable ancestor, so a two-finger gesture that starts
 * on the drawer, the picker grid or any of the horizontal strips is left entirely alone.
 * It also never touches single-finger events, so text selection, taps and drags on the
 * adult surfaces are unaffected — selection is a one-finger gesture. */
function installMultiTouchGuard() {
  function scrollableAncestor(el) {
    for (var n = el; n && n !== document.documentElement; n = n.parentNode) {
      if (n.nodeType !== 1) continue;
      var cs;
      try { cs = getComputedStyle(n); } catch (e) { continue; }
      var oy = cs.overflowY, ox = cs.overflowX;
      if ((oy === 'auto' || oy === 'scroll') && n.scrollHeight > n.clientHeight + 2) return n;
      if ((ox === 'auto' || ox === 'scroll') && n.scrollWidth > n.clientWidth + 2) return n;
    }
    return null;
  }
  function onTouchStart(ev) {
    if (!ev.touches || ev.touches.length < 2) return;
    var t = ev.target;
    if (!t || t.nodeType !== 1) return;
    if (scrollableAncestor(t)) return;
    if (ev.cancelable) ev.preventDefault();
  }
  /* Capture, so it is reached before a panel's own handler can stop propagation, and
   * NON-PASSIVE, because a passive listener cannot preventDefault and Chrome makes
   * document-level touch listeners passive by default. Without that flag this whole
   * function is a no-op that looks like a guard. */
  document.addEventListener('touchstart', onTouchStart, { capture: true, passive: false });
  window.__multiTouchGuard = { scrollableAncestor: scrollableAncestor };
  return window.__multiTouchGuard;
}

/* === Init === */
loadSupabaseConfig();
render();
installZoomRecovery();
installMultiTouchGuard();
startPolling();

/* === Service Worker === */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function(e) { console.log('SW:', e); });
}

/* === Lock to Landscape === */
try { screen.orientation.lock('landscape').catch(function(){}); } catch(e) {}
