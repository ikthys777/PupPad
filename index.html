  return '<div class="pad-btn" data-id="'+btn.id+'" style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 8px 8px;border-radius:14px;cursor:pointer;background:'+(isOn?'rgba(255,255,255,0.08)':'rgba(255,255,255,0.03)')+';box-shadow:'+(isOn?'0 0 12px '+btn.glow+'44,inset 0 0 8px '+btn.glow+'22':'inset 0 1px 0 rgba(255,255,255,0.05),0 2px 4px rgba(0,0,0,0.25)')+';position:relative;overflow:hidden;min-width:100px;transition:all 0.15s">'
    +'<div style="position:absolute;bottom:-4px;right:-5px;opacity:'+(isOn?0.12:0.03)+';transition:opacity 0.3s;pointer-events:none">'+pawSVG(20,btn.glow)+'</div>'
    +'<div style="width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;background:linear-gradient(145deg,'+btn.color+','+btn.color+'bb);box-shadow:'+(isOn?'0 0 16px '+btn.glow+'77,0 3px 8px '+btn.color+'55':'0 3px 8px '+btn.color+'44,inset 0 1px 0 rgba(255,255,255,0.2)')+';transition:box-shadow 0.2s">'+btn.emoji+'</div>'
    +'<span style="color:'+(isOn?btn.glow:'rgba(178,210,255,0.6)')+';font-size:10px;font-weight:700;letter-spacing:0.3px;transition:color 0.2s">'+btn.label+'</span>'
    +'</div>';
}

/* === THE GAMES HOST — PUP-WO-0200 §1.4 ====================================
 * The shell's half of the module contract. The module side is
 * docs/findings/PUP-WO-0000.md §8.1, the six obligations are §8.2 and the api surface
 * is §8.3; this code DEFERS to those and does not restate them.
 *
 * THE ONE THING TO READ BEFORE CHANGING ANYTHING HERE. §1.6 records that all three
 * existing openers append a full-bleed overlay EARLY and wire CLOSE LAST — Draw 152
 * lines later, Camera 287, Map 189 — and that Map is a confirmed live trap: if the
 * Leaflet CDN is unreachable the throw aborts the function before CLOSE is ever
 * wired, leaving a full-screen overlay with no exit and no keydown/popstate handler
 * anywhere in the file to dismiss it. Recovery is killing the app.
 *
 * THIS CODE MUST NOT REPRODUCE THAT SHAPE, and PUP-WO-0200 §3.4 makes it a
 * work-order-fails condition. So the way back is created, appended and WIRED before
 * the module is even fetched, let alone mounted. Everything that can throw — the
 * import, mount, teardown — happens after the exit already works. Fixing Draw, Camera
 * and Map is PUP-WO-0106 and deliberately not done here.
 */

/* Obligation 3's band. The shell's own surfaces sit at z-index 200 (remote photo,
 * gallery viewer), 100 (settings, PIN), 90 (alertFlash) and 80 (the three panels),
 * and §1.5 establishes that two of them can fire WHILE A GAME IS OPEN — no realtime
 * channel is ever left, so an incoming remote photo or alert still paints. Either
 * would cover the game AND the way back. #portraitBlock at 9999 must stay on top: a
 * rotated tablet is a real state and the rotate prompt is correct there.
 * Assigning this band is PUP-WO-0200's job (PUP-WO-0000 finding F4). */
var GAMES_Z = 500;

/* The live session, or null. Also the "one at a time" latch of obligation 6. */
var gameSession = null;

/* THE PICKER'S BAND. Below the game host, above every console surface: the shell's own
 * overlays sit at 200 (remote photo, gallery), 100 (settings, PIN), 90 (alertFlash) and
 * 80 (the three panels), and #portraitBlock at 9999 must stay on top of everything. A
 * picker ABOVE the game host would paint over a running game; one below it is covered by
 * the game it launched, which is the correct order. */
var PICKER_Z = 400;

/* EVERY TOUCH CONTROL THIS SHELL OWNS ON THE GAMES PATH GOES THROUGH HERE — the seven
 * console pad buttons, the picker's tiles, and both exits.
 *
 * (An earlier version of this comment said "every touch control in this app", and an
 * adversarial pass proved it false ON THE ENTRY POINT: the pad buttons were still wired
 * on bare `click`, so the Games button — the picker's only door — was inert to the very
 * two gestures this function exists to survive. The claim is now scoped to what it
 * covers. Draw, Camera, Map, the settings panel and the PIN keypad do NOT go through it;
 * they are PUP-WO-0106's, and naming that is cheaper than a comment that overreaches.)
 *
 * PUP-WO-0300's pass found #gameBack inert for two ordinary gestures because it was
 * wired on `click`: a browser synthesises no click while a second finger is on the
 * glass, and none for a tap that slides more than ~15px. Both are a three-year-old's
 * normal gesture — he plays with both hands and his tap is a smudge. That is
 * architecture §6.1 member 6's founding case.
 *
 * The fix belonged to one button then. This work order adds tiles, which are the same
 * kind of control with the same audience, so the fix becomes a FUNCTION rather than a
 * second copy of itself — two copies of a rule is how this project's fences drifted four
 * times in a week.
 *
 * `armed` requires the press to have STARTED on the element, so a finger dragged across
 * the screen and released on a tile does not launch it. `used` makes the pair idempotent,
 * so the trailing click — which is also what a keyboard Enter produces, and that is why
 * the click handler stays — is a no-op rather than a second activation. */
function wireTap(el, fn, opts) {
  /* `repeat` for a control that survives its own press — a console pad button is tapped
   * all day, and the one-shot latch below would kill it after one use. */
  var repeat = !!(opts && opts.repeat);
  var used = false, armed = false;
  function fire() {
    if (used && !repeat) return;
    used = true;
    fn();
  }
  el.addEventListener('pointerdown', function() { armed = true; });
  el.addEventListener('pointerup', function() { if (armed) { armed = false; fire(); } });
  el.addEventListener('pointercancel', function() { armed = false; });
  /* THE CLICK PATH IS FOR THE KEYBOARD AND NOTHING ELSE, and `detail === 0` is what says
   * so: a keyboard Enter or Space on a <button> produces a click with detail 0, while
   * every mouse and touch click carries detail >= 1 and has already been handled above.
   *
   * The unguarded version had a defect an adversarial pass demonstrated with a stack
   * trace. The trailing compatibility click is hit-tested against the DOM AS IT EXISTS
   * AFTER the pointerup handler ran — so a control CREATED during that handler, at those
   * coordinates, received it and fired itself. The picker's exit and a game's exit share
   * one rect by design, so a tile tap landing there would launch a game and instantly
   * close it: the child taps a game and is bounced back to the console with no
   * explanation. Latent today, closed now, and closed for every control at once. */
  el.addEventListener('click', function(e) { if (e && e.detail === 0) fire(); });
}

/* THE WAY BACK, BUILT ONCE FOR EVERY FULL-SCREEN SURFACE THIS SHELL OWNS.
 *
 * §1a.1 — REACHABILITY AND DOMINANCE ARE TWO PROPERTIES AND THEY WERE BEING TRADED.
 * The button was a 64px red disc with a 3px ring and a 4px halo: 78px of paint on a toy
 * whose entire point is watching a particle field. Scotty's finding, from touch. The
 * original reasoning for the size was sound — big, high-contrast, in the corner a thumb
 * reaches, because the person using it cannot read the label — and shrinking the control
 * would have traded away the thing that reasoning bought.
 *
 * So the two properties are separated instead. The HIT BOX stays 64x64 and transparent;
 * the PAINT shrinks to a 40px disc, about 50px including its ring and halo — 41% of the
 * former painted area — and sits centred inside it. Reachability is a property of the hit
 * box; dominance is a property of the paint. `pointer-events:none` on the disc so a
 * hit-test at the centre returns the BUTTON, which is what every check asks about.
 *
 * DO NOT SHRINK THE HIT BOX. This is the one control in the app that must never be hard
 * to hit, and the checks that assert 44px are asserting the box, not the paint. */
function makeBackButton(z, onExit) {
  var btn = document.createElement('button');
  btn.setAttribute('aria-label', 'Back to the console');
  /* Kept 52px clear of #settingsBtn, which this used to sit on top of: tap one closed the
   * surface and tap two — what a child does when the first tap appears not to work —
   * landed on the console and opened the adult Supabase panel, which has two text inputs
   * and two exits labelled with WORDS. A non-reader cannot leave it. */
  btn.style.cssText = 'position:fixed;top:calc(max(10px,env(safe-area-inset-top)) + 52px);'
    + 'left:max(10px,env(safe-area-inset-left));z-index:' + z + ';width:64px;height:64px;'
    + 'border:0;background:transparent;padding:0;margin:0;cursor:pointer;touch-action:manipulation;'
    + 'display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent';
  var disc = document.createElement('span');
  /* The halo is outside the white ring so the exit's visibility is a property of the
   * button rather than a promise about what a game paints behind it: on the two light
   * backgrounds Gyre ships, the white ring alone measured 1.47:1 against the ground. */
  disc.style.cssText = 'width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,255,255,0.92);'
    + 'background:linear-gradient(145deg,#EF4444,#b91c1c);'
    + 'box-shadow:0 0 0 3px rgba(0,0,0,0.45),0 3px 10px rgba(0,0,0,0.5);'
    + 'display:flex;align-items:center;justify-content:center;pointer-events:none';
  disc.innerHTML = backArrowSVG(22, '#ffffff');
  btn.appendChild(disc);
  wireTap(btn, onExit);
  return btn;
}

/* ============================ THE CONTROL PANEL — PUP-WO-0301 ===============
 * WHAT IT IS: a control surface built from a DECLARATIVE MANIFEST a module publishes,
 * by a shell that knows nothing about any module. It is the same contract the picker
 * holds (architecture §4) applied one level down — the picker renders tiles from the
 * registry with no knowledge of a game; this renders controls from a seam with no
 * knowledge of what any of them do.
 *
 * WHERE THE SEAM IS AND WHY THAT IS NOT A SPECIAL CASE. `host[entry.id]` — for Gyre
 * that reads `host.gyre`, which is the seam PUP-WO-0300 built and PUP-WO-0301 §2.1
 * names. It is not a name this file knows: it is the registry id of whatever entry is
 * mounting, so a second game publishing `host.blockpop` gets a panel with no edit here.
 * A module that publishes nothing gets no panel and no error — games/hello.js is the
 * live proof of that path.
 *
 * THE VOCABULARY IS THREE KINDS. `slider` (bounds from the seam's own `.ranges`, so
 * a range is specified once — PUP-WO-0300 §9's first warning), `choice` (options carry
 * either an `icon` glyph or a `hex`, and a hex swatch IS the colour it selects, which
 * is §2.3's "colour is the label" and invariant 1 with no text at all), and `action`
 * (a method name on the seam; the shell calls it and knows nothing else).
 *
 * NOTHING HERE PAINTS A WORD. Every affordance is a pictograph, a geometric glyph or a
 * colour. `label` on a descriptor is used for `aria-label` only — a screen reader is a
 * different audience from a non-reader and costs nothing. That is what makes acceptance
 * 8 a test of the design rather than of a screenshot.
 *
 * WHY NOTHING ANIMATES. §3.6 forbids any state where getting out takes more than one
 * tap, "including mid-drag, mid-animation". The cheapest way to hold that clause for a
 * mid-animation state is not to have one: the drawer is shown or hidden, never in
 * between. The exit is also never covered — this whole layer is `pointer-events:none`
 * except on the controls themselves, the drawer is pinned to the BOTTOM and #gameBack
 * is at the TOP-LEFT, and the back button is appended to the chrome after this root so
 * it wins at equal z-index. */
var PANEL_Z = GAMES_Z + 1;

/* One glyph, drawn as text, never parsed as markup. `textContent`, so a manifest can
 * carry no markup even by accident — a module is same-realm and could do worse, but a
 * shell that innerHTMLs module-supplied strings is a habit, and habits outlive the
 * realm they were safe in. */
function panelGlyph(text, px) {
  var g = document.createElement('span');
  g.textContent = typeof text === 'string' ? text : '';
  g.style.cssText = 'font-size:' + px + 'px;line-height:1;pointer-events:none;'
    + 'display:block;text-align:center;letter-spacing:-0.06em';
  return g;
}

/* The shared shape of every pressable thing on this surface. `wireTap` is not optional
 * decoration: a browser synthesises no `click` while a second finger is on the glass or
 * after ~15px of touch slop, and both are a three-year-old's ordinary gesture
 * (architecture §6.1 member 6). Every control here is pressed the same way #gameBack is. */
function panelButton(size, radius, background, onTap, ariaLabel) {
  var b = document.createElement('button');
  b.type = 'button';
  b.setAttribute('aria-label', ariaLabel || '');
  b.style.cssText = 'width:' + size + 'px;height:' + size + 'px;border-radius:' + radius + 'px;'
    + 'border:2px solid rgba(255,255,255,0.22);background:' + background + ';padding:0;margin:0;'
    + 'display:flex;align-items:center;justify-content:center;cursor:pointer;'
    /* `pan-y`, AND `none` HERE WAS A REAL DEFECT ON THE ONLY DEVICE THAT MATTERS.
     * `touch-action: none` on a control tells the browser that NO gesture starting on it
     * may scroll an ancestor — so on a short screen, where the drawer holds more than it
     * can show, a finger landing anywhere on a control could not pan it. The controls are
     * most of the drawer's surface; the gaps between them are 8px. A child would have had
     * to find those gaps to reach the controls below the fold. `pan-y` lets the browser
     * take a vertical drag and leaves everything else to wireTap, which disarms on the
     * pointercancel the browser sends when it claims the gesture — so a pan never fires a
     * control and a tap still does. */
    + 'touch-action:pan-y;-webkit-tap-highlight-color:transparent;flex:0 0 auto;'
    /* EXPLICIT, because the bar this may sit in is `pointer-events:none` so that the
     * field shows through the gaps between the controls. A button that inherits none
     * is painted, reachable by `elementFromPoint`, and dead to a finger — which is
     * architecture §6.1 member 6 wearing a different costume. */
    + 'pointer-events:auto';
  wireTap(b, onTap, { repeat: true });
  return b;
}

function mountControlPanel(chrome, host, entry) {
  var seam = null;
  try { seam = host[entry.id]; } catch (e) { seam = null; }
  if (!seam || typeof seam !== 'object') return null;
  if (typeof seam.get !== 'function' || typeof seam.set !== 'function') return null;
  var controls = seam.controls;
  if (!controls || typeof controls.length !== 'number' || !controls.length) return null;

  var root = document.createElement('div');
  root.id = 'gameControls';
  root.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:' + PANEL_Z + ';'
    + 'pointer-events:none;-webkit-tap-highlight-color:transparent';

  var dock = document.createElement('div');
  /* THE DOCK MAY NOT EXCEED THE SURFACE, AND THE DRAWER IS WHAT GIVES. Without this the
   * bar and the drawer simply added up: at 412px of height 78vh is 321 and the bar is ~98,
   * so the column was 419 tall in a 412 box and the BAR WAS PUSHED OFF THE TOP — the dice
   * measured at y=-7, clipped by the screen. `max-height:100%` plus `min-height:0` on the
   * drawer below makes the drawer absorb the shortfall instead, at every height, with no
   * number to be wrong. */
  dock.style.cssText = 'position:absolute;left:0;right:0;bottom:0;display:flex;'
    + 'flex-direction:column;align-items:stretch;max-height:100%;pointer-events:none';

  var bar = document.createElement('div');
  /* THE LEFT INSET IS NOT PADDING, IT IS THE EXIT'S COLUMN, AND ITS ABSENCE WAS THE WORST
   * DEFECT IN THIS WORK ORDER. #gameBack is `position:fixed` at top ~62px, 64px square,
   * so it occupies x 10-74 and y 62-126 forever. The dice sits in this bar directly above
   * the drawer, so its centre is at roughly 0.28*H - 48 while the drawer's height cap
   * binds — which lands inside 62..126 for every viewport between about 393px and 621px
   * tall. At 800x480, 640x480, 1024x600 and 915x412 an adversarial pass measured that a
   * tap on the dice's own centre HIT THE BACK BUTTON: no randomize, the game closed, and
   * the child was dumped on the console. Only 26.5% of the dice was reachable at all.
   *
   * Every check passed throughout, including the one written for this panel, because they
   * all asked whether the panel covers the exit and none asked whether the EXIT covers a
   * control. The z-order discipline was right and one-directional.
   *
   * 84px clears x=74 with a margin, at every height, without depending on either
   * element's vertical position — which is what makes it a fix rather than a coincidence
   * that holds at the sizes someone happened to test. */
  bar.style.cssText = 'display:flex;align-items:flex-end;justify-content:space-between;'
    + 'gap:12px;padding:0 12px 10px max(84px,calc(env(safe-area-inset-left) + 74px));'
    + 'pointer-events:none';

  /* `align-content:safe start`, and the `safe` is load-bearing for the same reason it is
   * in the picker: a centred overflowing container pushes its first rows ABOVE the
   * scroll origin, `scrollTop` cannot go negative, and those rows become permanently
   * unreachable. `start` cannot produce that state and `safe` says so out loud. */
  var drawer = document.createElement('div');
  drawer.id = 'gameControlsDrawer';
  drawer.style.cssText = 'pointer-events:auto;background:rgba(9,13,22,0.86);'
    + 'border-top:2px solid rgba(255,255,255,0.18);box-shadow:0 -8px 26px rgba(0,0,0,0.55);'
    /* 72vh, RAISED FROM 58 ON A MEASUREMENT: at 58 the last two rows sat below the fold
     * on a 1024x640 screen and `spin` could not be pressed without scrolling first. It
     * still scrolls on a short viewport — sixteen controls with no words take room, and
     * §2.2b's ruling is that a control is worth a row — so the drawer pans with a finger
     * and check 19 proves that it does, rather than assuming a child will find it. */
    /* 78vh AND A DENSER GRID. At 72vh with 56px rows this held 460px of content in a
     * 459px box on a 1024x640 screen — overflow by one pixel, which is not "it fits", and
     * on the 480px-tall shape this actually runs on FOUR CONTROLS WERE PAINTED AND COULD
     * NOT BE PRESSED. Sixteen controls with no words take room and §2.2b's ruling is that
     * a control is worth a row, so the room comes from the rows rather than from the
     * controls: 56px sliders become 50, 52px buttons become 46, the gap 10 becomes 8. The
     * drawer still pans when it must, and now the pan actually works (see panelButton). */
    /* THE CAP IS THE EXIT'S BAND, NOT A FRACTION OF THE SCREEN. #gameBack is fixed at
     * y 62-126 forever, so any surface whose TOP rises above ~140px puts its first row
     * under the exit — and on a 480px screen at 78vh it did exactly that: the polarity
     * button and the first colour swatches sat inside the exit's hit box, where a tap
     * closes the toy instead of pressing them. The dice had the same collision in the bar
     * above (see there). Capping the drawer's top below the band removes it at EVERY
     * height rather than at the heights someone happened to measure, which is what the
     * 84px inset does for the bar. Two geometric rules, both independent of viewport. */
    /* THE LEFT GUTTER IS THE EXIT'S COLUMN, the same 84px the bar above uses, and it is
     * what makes the collision impossible rather than unlikely. Capping the drawer's
     * HEIGHT below the exit's band worked only until the drawer was scrolled, at which
     * point its top rows slid up under the exit again. #gameBack owns x 10-74 at every
     * height and every scroll position; keeping the drawer's content out of that column
     * is a rule no scroll can defeat, and it lets the drawer keep its full height. */
    /* NO `78vh`. A fraction of the screen is architecture §5's own anti-pattern and this
     * was the file's worst instance: 78vh is 500 on the 640px screen it was measured at
     * and 321 on the 412px screen the toy runs on, where it left 91px of playfield and
     * pushed the bar off the top. `flex:0 1 auto` with `min-height:0` says the thing that
     * is actually meant — TAKE WHAT IS LEFT AFTER THE BAR — and it holds at any height. */
    + 'flex:0 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;'
    /* 4px OF SLACK AT THE BOTTOM, AND IT IS NOT COSMETIC. Rows are 48.76px and gaps 8px,
     * so the last row's bottom lands on a fraction and overflowed the content box by
     * 0.38px — check 19 correctly called two controls unreachable, because even fully
     * panned they could not be brought entirely on screen. A third of a pixel is not a
     * usability defect and it IS a real clip; the slack removes it rather than the
     * assertion being loosened to tolerate it. */
    + 'padding:10px 10px calc(14px + env(safe-area-inset-bottom)) max(84px,calc(env(safe-area-inset-left) + 74px));'
    /* 132, NOT 230, AND THE NUMBER WAS MEASURED RATHER THAN REASONED. At 230 the fleet's
     * 785px of usable width takes exactly THREE columns, stacking sixteen controls into
     * 406px of content inside a ~300px drawer — a pan that is MANDATORY, and a non-reader
     * does not discover a pan. Rows cannot shrink to pay for it: the buttons are already
     * 48.76px against a 44px minimum touch target, so the room has to come from COLUMNS.
     * 132 takes six columns, and it is the value the MEASUREMENT chose rather than the
     * reasoning. buildChoice's row is `flex-wrap:wrap`, so at 132 the small choices wrap
     * their icon onto one line and their options onto the next — 100px cells — and I
     * moved to 176 on exactly that argument. 176 goes RED at five assertions and 132 goes
     * green: the wrapped cells are taller and every control still lands on the glass,
     * while at 176 they do not. THE PREDICTION WAS WRONG AND THE FLEET SAID SO. Wider
     * screens get more columns, which is what auto-fit is for. */
    + 'display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));'
    + 'gap:8px;align-content:safe start';

  /* Every control registers a repaint here. `randomize()` changes nine settings at once
   * and the seam announces once; without this the sliders would show the settings the
   * child had BEFORE he pressed the dice, which is a control surface that lies. */
  var syncs = [];
  var lastValues = {};
  function currentValues() {
    try { return seam.get() || {}; } catch (e) { return lastValues; }
  }
  function repaint(vals) {
    lastValues = vals || {};
    for (var i = 0; i < syncs.length; i++) { try { syncs[i](lastValues); } catch (e) {} }
  }
  function write(key, value) {
    try { seam.set(key, value); } catch (e) {}
    repaint(currentValues());
  }

  /* ---- slider ---- */
  function buildSlider(desc) {
    var rng = null;
    try { rng = seam.ranges && seam.ranges[desc.key]; } catch (e) { rng = null; }
    if (!rng || typeof rng.length !== 'number' || rng.length < 2) return null;
    var lo = Number(rng[0]), hi = Number(rng[1]), step = Number(rng[2]);
    if (!isFinite(lo) || !isFinite(hi) || !(hi > lo)) return null;
    if (!isFinite(step) || step <= 0) step = 0;

    var row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;gap:8px;pointer-events:auto';
    var ico = panelGlyph(desc.icon, 24);
    ico.style.cssText += ';width:30px;flex:0 0 auto';
    row.appendChild(ico);

    var track = document.createElement('div');
    track.setAttribute('role', 'slider');
    track.setAttribute('tabindex', '0');
    track.setAttribute('aria-label', desc.label || desc.key);
    track.setAttribute('aria-valuemin', String(lo));
    track.setAttribute('aria-valuemax', String(hi));
    track.dataset.control = desc.key;
    /* 56px tall, and the WHOLE BAR is the target — a tap anywhere on it jumps the value
     * to that position. A three-year-old's aim is not an adult's, and a 20px thumb he
     * has to catch first is a control he cannot use. */
    /* `pan-y` for the same reason, and it is exactly right for a HORIZONTAL control
     * inside a VERTICAL scroller: the browser keeps vertical panning and hands us
     * everything horizontal, which is the only direction this slider reads. */
    track.style.cssText = 'position:relative;flex:1 1 auto;height:50px;border-radius:14px;'
    /* THE RING IS AN INSET SHADOW, NOT A BORDER, AND THAT IS THE FIX RATHER THAN A STYLE
     * CHOICE. A border gives the track TWO boxes: `fill`'s percentage width resolves
     * against the PADDING box while every measurement of the track — the hit test, and
     * check 19's own assertion — reads the BORDER box. Two denominators that differ by
     * 4px, which is the family of defect this project has now been bitten by five times.
     * An inset shadow paints the identical ring and leaves ONE box, so the painted
     * position and the value cannot disagree at any width. */
      + 'background:rgba(255,255,255,0.10);box-shadow:inset 0 0 0 2px rgba(255,255,255,0.20);'
      + 'overflow:hidden;touch-action:pan-y;cursor:pointer;min-width:0';
    var fill = document.createElement('div');
    fill.style.cssText = 'position:absolute;left:0;top:0;bottom:0;width:0;'
      + 'background:linear-gradient(90deg,#22D3EE,#818CF8);pointer-events:none';
    var knob = document.createElement('div');
    knob.style.cssText = 'position:absolute;top:5px;bottom:5px;width:12px;border-radius:7px;'
      + 'background:#ffffff;box-shadow:0 2px 8px rgba(0,0,0,0.7);pointer-events:none;'
      + 'margin-left:-6px;left:0';
    track.appendChild(fill);
    track.appendChild(knob);
    row.appendChild(track);

    var painted = null;
    function paint(vals) {
      var v = Number(vals[desc.key]);
      if (!isFinite(v)) return;
      if (v === painted) return;
      painted = v;
      var t = (v - lo) / (hi - lo);
      t = t < 0 ? 0 : t > 1 ? 1 : t;
      fill.style.width = (t * 100) + '%';
      knob.style.left = (t * 100) + '%';
      track.setAttribute('aria-valuenow', String(v));
    }
    syncs.push(paint);

    /* THE PROJECTION IS NOT A SECOND SET OF BOUNDS. What is clamped here is the POINTER
     * POSITION to the track it was pressed on — geometry — and `lo`/`hi` come from the
     * seam's own `.ranges`. PUP-WO-0300 §9's first warning is against a control
     * re-stating a range the setter already enforces; this restates nothing, and a value
     * the setter rejects is still a no-op there rather than a reset here. */
    function valueAt(clientX) {
      var r = track.getBoundingClientRect();
      /* THE PADDING BOX, BECAUSE THAT IS THE BOX THE PAINT USES — and until this line
       * they were two different boxes. `fill.style.width` and `knob.style.left` are
       * percentages on absolutely-positioned children, which resolve against the
       * CONTAINING BLOCK'S PADDING BOX; this hit test read `getBoundingClientRect`, which
       * is the BORDER box. The track has a 2px border, so the knob was painted up to 4px
       * from where a tap at that same position would land — the slider showing a position
       * that is not its value, at every width this panel has ever been drawn at.
       *
       * It was invisible because 4px of a 230px column is 1.7% and check 19's tolerance
       * is 2%. Narrowing the column to 132 to make the panel fit a 412px phone pushed the
       * same 4px to 2.8% and it went red. THE DEFECT DID NOT ARRIVE WITH THE NARROW
       * COLUMN; the narrow column stopped hiding it.
       *
       * Derived from the element rather than written down, so a border change cannot
       * reopen it: clientWidth is the padding box by definition. */
      var pad = track.clientWidth;
      var edge = (r.width - pad) / 2;
      var t = pad > 0 ? (clientX - r.left - edge) / pad : 0;
      t = t < 0 ? 0 : t > 1 ? 1 : t;
      var v = lo + t * (hi - lo);
      if (step > 0) v = Math.round(v / step) * step;

       * and that value is not `===` the one the seam holds, so every drag would report a
       * change and schedule a save. Six places is finer than any step this seam has. */

     * rather than fighting the first for it — and, more to the point, a second finger

     * the reason none of this is wired on `click`. */

      write(desc.key, valueAt(e.clientX));
    });

    track.addEventListener('pointercancel', endDrag);

      else if (e.key === 'Home') next = lo;

    }

    var isSwatch = !!(opts[0] && typeof opts[0].hex === 'string');

    var row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;gap:8px;flex-wrap:wrap;pointer-events:auto';
    if (isSwatch) row.style.gridColumn = '1 / -1';

       * One tap flips it, and PUP-WO-0300 measured that the flip is visible on sight —
       * 37% of the frame inked becomes 0.0%. A row of two would make the child choose
       * between two things he cannot read; a single button that changes what it shows
       * is a thing he presses to see what happens, which is the only instruction a
       * non-reader ever gets. */
      var cycle = panelButton(58, 16, 'linear-gradient(145deg,#334155,#1e293b)', function() {
        var i = indexOfValue(currentValues()[desc.key]);
        var next = opts[(i + 1 + opts.length) % opts.length];
        if (next) write(desc.key, next.id);
      }, desc.label || desc.key);
      cycle.dataset.control = desc.key;
      var cg = panelGlyph('', 26);
      cycle.appendChild(cg);
      syncs.push(function(vals) {
        var i = indexOfValue(vals[desc.key]);
        var o = opts[i === -1 ? 0 : i];
        cg.textContent = o && typeof o.icon === 'string' ? o.icon : '';
        cycle.dataset.value = String(o ? o.id : '');
      });

    var cells = [];
    for (var i = 0; i < opts.length; i++) {
      (function(opt) {
        if (!opt || opt.id === undefined || opt.id === null) return;
        /* VALIDATED, because this string is concatenated into an inline `style` and the
         * picker learned this exact lesson on the registry's `color` four hundred lines
         * above: a `hex` of "red;position:fixed;inset:0;z-index:2147483647" builds a
         * button that covers the entire screen and every other control. The exit survived
         * it — the insertBefore ordering held — but the toy did not. Same trust level as
         * the registry, same answer: a typo surface gets a validator, not a promise. */
        var bg = isSwatch && GAMES_HEX_RE.test(opt.hex)
          ? opt.hex : 'linear-gradient(145deg,#334155,#1e293b)';
        var b = panelButton(isSwatch ? 42 : 46, isSwatch ? 21 : 14, bg, function() {
          write(desc.key, opt.id);
        }, (desc.label || desc.key) + ' ' + String(opt.id));
        b.dataset.control = desc.key;
        b.dataset.value = String(opt.id);
        if (isSwatch) {
          if (!GAMES_HEX_RE.test(opt.hex)) return;
          b.dataset.hex = String(opt.hex);
        } else {
          var g = panelGlyph(opt.icon, 24);
          if (opt.off) {
            /* OFF IS DRAWN, NOT OMITTED: the same pictograph, dimmed, with a bar through
             * it. A child compares the two buttons and sees which one is lit; the effect
             * itself is the other half of the answer and it is immediate. */
            g.style.opacity = '0.4';
            var slash = document.createElement('span');
            slash.style.cssText = 'position:absolute;left:8px;right:8px;height:3px;'
              + 'background:#f87171;border-radius:2px;transform:rotate(-32deg);pointer-events:none';
            b.style.position = 'relative';
            b.appendChild(slash);
          }
          b.appendChild(g);
        }
        cells.push({ el: b, id: opt.id });
        row.appendChild(b);
      })(opts[i]);
    }
    if (!cells.length) return null;
    syncs.push(function(vals) {
      var v = vals[desc.key];
      for (var k = 0; k < cells.length; k++) {

        cells[k].el.style.boxShadow = on
          ? '0 0 0 3px #ffffff,0 0 0 7px rgba(0,0,0,0.55)'
          : '0 2px 6px rgba(0,0,0,0.4)';

  /* ---- action ---- */
  function buildAction(desc, big) {
    if (typeof desc.method !== 'string') return null;
    /* OWN PROPERTY ONLY. `seam['toString']` is a function, so a one-word typo in a
     * manifest built a real, pressable button — `prominent: true` put it in the dice's
     * place — that called Object.prototype.toString and did nothing a child could see.
     * §7: better absent than present-and-uninterpretable. */
    if (!Object.prototype.hasOwnProperty.call(seam, desc.method)) return null;
    var fn = seam[desc.method];
    if (typeof fn !== 'function') return null;
    var size = big ? 88 : 50;
    var bg = big
      ? 'linear-gradient(145deg,#FBBF24,#D97706)'
      : 'linear-gradient(145deg,#334155,#1e293b)';
    var b = panelButton(size, big ? 26 : 16, bg, function() {
      try { seam[desc.method](); } catch (e) {}
      repaint(currentValues());
    }, desc.label || desc.method);
    b.dataset.control = desc.method;
    if (big) {
      b.style.border = '3px solid rgba(255,255,255,0.9)';
      b.style.boxShadow = '0 0 0 4px rgba(0,0,0,0.45),0 6px 18px rgba(0,0,0,0.55)';
      b.style.pointerEvents = 'auto';
    }
    b.appendChild(panelGlyph(desc.icon, big ? 38 : 26));
    return b;
  }

  /* ---- assemble ---- */
  var prominent = [];
  for (var c = 0; c < controls.length; c++) {
    var desc = controls[c];
    if (!desc || typeof desc !== 'object') continue;
    var node = null;
    if (desc.kind === 'slider') node = buildSlider(desc);
    else if (desc.kind === 'choice') node = buildChoice(desc);
    else if (desc.kind === 'action') node = buildAction(desc, !!desc.prominent);
    if (!node) continue;

    else drawer.appendChild(node);
  }
  if (!drawer.children.length && !prominent.length) return null;

  /* The dice lives OUTSIDE the drawer and is always on screen. §2.2: "one big button …
   * make it the most obvious thing on the surface", and at 76px it was 5,776px2 against a
   * slider's 15,828 — a third of the size of the thing it was supposed to out-shout. 88px
   * with a white ring and the only amber on the screen. It is still smaller than a slider
   * in area, and that is a deliberate trade rather than an oversight: a slider is wide
   * because it is a TRACK a finger travels, and the dice only has to be HIT. What makes
   * it the most obvious thing is that it is the only warm-coloured control, it is always
   * on screen when the drawer is shut, and nothing else sits in that corner.
   *
   * It is bigger than #gameBack on purpose — the exit is deliberately small so it does
   * not dominate the field (PUP-WO-0201 §1a.1) — and the two are in opposite corners. */
  var left = document.createElement('div');
  left.style.cssText = 'display:flex;align-items:flex-end;gap:10px;pointer-events:none';
  for (var p = 0; p < prominent.length; p++) left.appendChild(prominent[p]);

  var drawerOpen = true;
  var handle = panelButton(60, 18, 'linear-gradient(145deg,#334155,#0f172a)', function() {
    setOpen(!drawerOpen);
  }, 'Show or hide the controls');
  handle.style.boxShadow = '0 4px 14px rgba(0,0,0,0.55)';
  handle.id = 'gameControlsHandle';
  var handleGlyph = panelGlyph('', 28);
  handle.appendChild(handleGlyph);

  /* Remembered per game, in the SHELL's own key — the module's `api.save` namespace is
   * the child's settings and this is a shell preference about a shell surface. Reading
   * it is wrapped: private mode throws on the getter, and a toy that will not open
   * because storage is unavailable is a worse bug than a drawer in the wrong state. */
  var OPEN_KEY = 'pupctl:' + entry.id + ':open';
  function setOpen(open) {
    drawerOpen = !!open;
    /* `display`, NOT the `hidden` attribute. `[hidden]{display:none}` is a UA rule and
     * this element carries an INLINE `display:grid`, which wins — so `drawer.hidden =
     * true` would set the attribute, satisfy every assertion that reads it, and leave
     * the drawer on screen. An assertion that passes over a visible panel is exactly
     * the family this project keeps finding. */
    drawer.style.display = open ? 'grid' : 'none';

   *
   *   stored '1' or '0'  ->  THE CHILD'S CHOICE WINS, always, whatever the module says
   *   absent             ->  seam.controlsOpen === true, else CLOSED
   *
   * Flipping `!== '0'` to `=== '1'` would look like the same change and is not: it makes
   * ABSENT mean closed for every game, silently discarding controlsOpen and handing Gyre
   * a shut drawer on a fresh install. The stored value has to be read as three states —
   * '1', '0', and nothing — not as a boolean.
   *
   * WHY THE DEFAULT MOVES AT ALL: hard-coded open, the drawer is 321px of a 412px fleet
   * screen, leaving 91px of playfield. §8.8 puts the default on the seam.
   *
   * THERE WERE THREE `true`s HERE AND ONLY TWO WERE LIVE. The initializer was shadowed
   * because both the try and its catch assigned; this rewrite lets the try FALL THROUGH,
   * which puts the initializer on a reachable path for the first time. "It is dead code"
   * was true right up until this line landed. So the initializer is now `false` — the
   * ruled fallback — and the catch is explicit rather than a repeat of it.
   *
   * `controlsOpen` IS MODULE-SUPPLIED AND THEREFORE UNTRUSTED, exactly as the seam is:
   * absent is not an error, a throwing getter must not take the panel down, and the test
   * is `=== true` rather than truthiness — a module returning the string 'false', or 0,
   * or a Proxy, must not be able to decide this by accident. */
  var wants = false;
  try { wants = seam.controlsOpen === true; } catch (e) { wants = false; }
  var startOpen = wants;
  try {
    var stored = localStorage.getItem(OPEN_KEY);
    if (stored === '1') startOpen = true;
    else if (stored === '0') startOpen = false;
  } catch (e) { startOpen = wants; }

  bar.appendChild(left);
  bar.appendChild(handle);
  dock.appendChild(bar);
  dock.appendChild(drawer);
  root.appendChild(dock);

  setOpen(startOpen);
  repaint(currentValues());

  /* APPENDED BEFORE #gameBack IS. `back` is already in the chrome, so `appendChild`
   * would put this layer on top of it at equal z-index — and a panel over the exit is
   * §3.6 failing in the one place this project has already been bitten. `insertBefore`
   * with the chrome's first child keeps the exit last in paint order, whatever this
   * layer does. */
  chrome.insertBefore(root, chrome.firstChild);

  var unsub = null;
  if (typeof seam.subscribe === 'function') {
    try { unsub = seam.subscribe(function(vals) { repaint(vals); }); } catch (e) { unsub = null; }
  }

  return function panelTeardown() {
    try { if (typeof unsub === 'function') unsub(); } catch (e) {}
    try { if (root.parentNode) root.parentNode.removeChild(root); } catch (e) {}
  };
}


/* Genuinely recursive: the first version froze two levels and was named for a depth it
 * did not have, so a `params:{grid:{w:3}}` entry would hand the game a mutable `grid`. */
function deepFreezeEntry(entry) {
  var copy = JSON.parse(JSON.stringify(entry));
  (function freeze(o) {
    Object.keys(o).forEach(function(k) { if (o[k] && typeof o[k] === 'object') freeze(o[k]); });
    Object.freeze(o);
  })(copy);
  return copy;
}

/* PUP-WO-0000 §9.1 constrains `module` to /^\.\/games\/[a-z0-9-]+\.js$/ — AND NOTHING
 * ENFORCED IT. The adversarial pass loaded, through this shell: a module with an mjs
 * extension, one inside a subdirectory, one with an upper-case name, one reached by a
 * parent-directory traversal out of the games folder, and one named by a full remote
 * URL — the last executing remote code — with every CI check green.
 * (Those examples are described rather than written out, because check 2 reads any
 * quoted path-like string in this file as an asset reference and went red on the
 * comment. A check that cannot tell prose from code is a fact worth knowing.) A spec that
 * only a document knows is a convention — the same shape as §8.3's `fetch`, one section
 * later. This is the enforcement. */
var GAMES_MODULE_RE = /^\.\/games\/[a-z0-9-]+\.js$/;
var GAMES_ID_RE = /^[a-z][a-z0-9-]*$/;
var GAMES_HEX_RE = /^#[0-9a-fA-F]{6}$/;

/* NOW ENFORCING THE FIELDS THAT REACH A STYLE STRING, WHICH IT DID NOT BEFORE.
 *
 * The comment above has always said "§9.1's shape, ENFORCED rather than documented". It
 * checked two of the nine constraints. An adversarial pass on PUP-WO-0201 pointed out
 * that the two it skipped which MATTER are `color` and `glow`, because the picker splices
 * both straight into a tile's inline `cssText` — and demonstrated a `color` of
 * `red;position:fixed;inset:0;z-index:9999` terminating the background declaration and
 * painting a full-bleed tile ABOVE the picker's own exit, so `elementFromPoint` at the
 * button returned the tile.
 *
 * The registry is author-controlled, so this is not an attack surface in the usual sense
 * — it is a TYPO surface, and the failure mode is a child looking at a coloured rectangle
 * with the way back underneath it. §9.1 says these are `/^#[0-9a-fA-F]{6}$/`; that is now
 * what the word ENFORCED means here.
 *
 * `sound` and `players` are still not checked: an unknown sound is a silent no-op rather
 * than a broken surface, `players` is unread until architecture §7 seam 4 exists, and a
 * validator that refuses a tile over a field with no visible consequence would cost a
 * whole game for a typo. Stated so the gap is known rather than discovered. */
function registryEntryIsValid(e) {
  return !!e
    && GAMES_ID_RE.test(e.id)
    && GAMES_MODULE_RE.test(e.module)
    && GAMES_HEX_RE.test(e.color)
    && GAMES_HEX_RE.test(e.glow)
    && typeof e.label === 'string' && e.label.length >= 1 && e.label.length <= 12
    && typeof e.icon === 'string' && e.icon.length >= 1 && e.icon.length <= 8;
}

/* OBLIGATION 4 — exactly one close path. This function, and nothing else, calls
 * teardown and removes the DOM. It has exactly two callers: the shell's own back
 * button and api.close(), which is a REQUEST that delegates here rather than a second
 * path of its own. §1.3 (the openCanvas monkey-patch) is what a genuinely second
 * close path costs. Idempotent: safe to call twice, safe to call with no session. */
function endGameSession() {
  if (!gameSession) return;
  var s = gameSession;

   * no-op instead of recursing. */
  gameSession = null;
  try {
    if (typeof s.teardown === 'function') s.teardown();
  } catch (e) {

     * behind a full-bleed overlay — that is §1.6 reproduced by the very contract
     * written to prevent it. The removal is in `finally`, never on the line after
     * the call. */
    if (window.console && console.error) console.error('[games] teardown threw; removing host anyway', e);
  } finally {
    /* FIRST IN THE `finally`, and wrapped like everything else in it. The panel holds a
     * subscription on the module's seam; the seam is already dead by now, so this is
     * belt and braces rather than the load-bearing release — but a teardown that skips
     * its own unsubscribe because an earlier line threw is how a watcher array survives
     * a session, and PUP-WO-0300's pass proved that one the hard way. */
    try { if (typeof s.panel === 'function') s.panel(); } catch (e) {}
    if (s.chrome && s.chrome.parentNode) s.chrome.parentNode.removeChild(s.chrome);

     * The adversarial pass produced §1.6's trap THROUGH this host, with a one-word bug:
     * a module that appends a full-screen node to `document.body` instead of to `host`
     * and forgets it in teardown. `endGameSession` removed the chrome, reported success,
     * and left the child looking at a solid rectangle with the console unreachable and
     * no back button anywhere — AFTER a teardown the shell recorded as clean. Both games
     * checks passed it.
     *
     * The shell cannot make a module tidy up. It CAN refuse to leave the screen in a
     * state a three-year-old cannot escape, which is the actual obligation. So: anything
     * that appeared at body level while the game was open, and is still there after
     * teardown, is removed and reported. Loudly, because the module has a bug — this is
     * a backstop, not a licence.
     *
     * It also covers the teardown-leaks-during-teardown case (a "goodbye flourish"
     * appended by teardown itself, after the chrome is already gone), and the async
     * drift case, where handles acquired AFTER mount returned are outside the returned
     * closure's reach by construction. */
    try {

      for (var i = 0; i < document.body.children.length; i++) {

      for (var j = 0; j < leaked.length; j++) {
        if (window.console && console.warn) {
          console.warn('[games] ' + (s.entry && s.entry.id) + ' left a node on document.body that its teardown did not remove; the shell removed it. A game must touch nothing outside its host (PUP-WO-0000 §8.1).', leaked[j]);
        }
        if (leaked[j].parentNode) leaked[j].parentNode.removeChild(leaked[j]);
      }
    } catch (e) { /* the sweep must never be the reason the exit fails */ }

     * game schedule up to three seconds of sound; without this, a note started as the
     * child reaches for the way back plays over the console he lands on. Last, and
     * wrapped, so it can never be the reason the exit fails. */
    try { stopGameTones(); } catch (e) {}

}

function openGames(entry) {

   * button then refuses FOREVER — the console works and games are simply dead until a
   * reload. Recover instead of latching on a corpse. */
  if (gameSession) {

    if (window.console && console.warn) console.warn('[games] previous session lost its DOM; recovering');

  var chrome = document.createElement('div');

   * because the person using it cannot read the label. This is what keeps a child from
   * being stranded (northstar §6's "needs an adult to get into or out of a game").
   *
   * WHAT THAT BUYS AND WHAT IT DOES NOT — corrected after the adversarial pass, which
   * disproved the second half of what this comment used to claim.
   *

   *   defect and it is closed.

   *   dialog.showModal() and requestFullscreen(), which render in the TOP LAYER above

   *   and those are architecture calls — flagged to CC-A, not half-built here.

   * module cannot bury it, and this comment must not be read as though it does. */

   * console, the rotate prompt and the script tag were all swept as "leaked". */
  var bodyBefore = [];
  for (var bi = 0; bi < document.body.children.length; bi++) bodyBefore.push(document.body.children[bi]);

  chrome.appendChild(host);
  chrome.appendChild(back);
  document.body.appendChild(chrome);

  /* The session exists — and therefore the way back works — before anything that can
   * throw runs. */
  gameSession = { chrome: chrome, host: host, teardown: null, entry: entry, bodyBefore: bodyBefore };

  var frozen = deepFreezeEntry(entry);
  var reduced = false;
  try { reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) {}

  /* §8.3's api surface. Frozen, and every member wrapped so a game cannot break the
   * shell through one: `sound` is fire-and-forget and never throws, `vibrate` no-ops
   * where unsupported, and `save` never throws — a quota-exhausted or private-mode
   * device must degrade silently rather than break teardown. `load()` may return null
   * and the game must run correctly when it does: this is preference state, never
   * identity, never required. */
  var api = Object.freeze({
    entry: frozen,
    close: function() { endGameSession(); },
    sound: function(name) { try { doSound(name); } catch (e) {} },
    /* PUP-WO-0300 §2.1. Ratified architecture §5 2026-09-01, built 2026-09-02 — the
     * fourth ruling this project made and had not turned into a commit. Same
     * fire-and-forget discipline as `sound`: playTone clamps, this never throws, and
     * a game that asks for a note on a device with no audio simply gets silence. */
    tone: function(hz, ms, wave) { try { playTone(hz, ms, wave); } catch (e) {} },
    vibrate: function(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} },
    save: function(obj) {
      try { localStorage.setItem('pupgame:' + frozen.id, JSON.stringify(obj)); } catch (e) {}
    },
    load: function() {
      try { var raw = localStorage.getItem('pupgame:' + frozen.id); return raw ? JSON.parse(raw) : null; }
      catch (e) { return null; }
    },
    prefersReducedMotion: reduced
  });

  /* Everything below can fail. Nothing below can strand anyone. */
  import(entry.module).then(function(mod) {
    /* The way back may already have been used while the module was loading. */
    if (!gameSession || gameSession.chrome !== chrome) return;
    var mount = mod && mod.default;
    if (typeof mount !== 'function') throw new Error('games: ' + entry.id + ' has no default export');
    /* OBLIGATION 5 — mount inside try/catch. On a throw the shell tears down and
     * returns to the console. */
    var td;
    try {
      td = mount(host, api);
    } catch (e) {
      if (window.console && console.error) console.error('[games] mount threw', e);
      endGameSession();
      return;
    }
    if (typeof td !== 'function') {
      if (window.console && console.error) console.error('[games] ' + entry.id + ' did not return a teardown function');
      endGameSession();
      return;
    }
    /* If the module called api.close() from INSIDE mount, the session is already gone
     * and this teardown would be dropped on the floor — an interval kept ticking forever
     * with the host long removed, in the one case the contract's own close() exists to
     * handle. Run it now rather than discarding it. */
    if (!gameSession || gameSession.chrome !== chrome) {
      try { td(); } catch (e) { if (window.console && console.error) console.error('[games] late teardown threw', e); }
      return;
    }
    gameSession.teardown = td;

    /* THE CONTROL PANEL — PUP-WO-0301. Built AFTER `teardown` is recorded, and that
     * order is the whole safety argument: everything above this line is the contract
     * PUP-WO-0000 §8.1 specifies, and nothing here may put it at risk. If this throws,
     * the game is already mounted, the teardown is already held, the exit already
     * works, and the child gets a toy with no panel instead of no toy. A module that
     * publishes no seam takes the same path and it is not an error — games/hello.js is
     * the live case. */
    try {
      gameSession.panel = mountControlPanel(chrome, host, entry);
    } catch (e) {
      if (window.console && console.error) console.error('[games] control panel failed to build; the game runs without it', e);
    }
  }).catch(function(e) {
    /* The module could not be fetched or parsed. Offline with no cached copy lands
     * here, and the way back already works. */
    if (window.console && console.error) console.error('[games] could not load ' + entry.module, e);
    endGameSession();
  });
}

/* ============================ THE PICKER — PUP-WO-0201 =====================
 * A full-screen surface of large tiles, one per registry entry, that knows NOTHING about
 * any specific game. Architecture §4 calls that a contract, and its test is that adding a
 * registry entry changes what the child sees with no edit here.
 *
 * IT OPENS EVEN WITH ONE GAME (§2.2), and the shortcut is tempting and wrong. A
 * non-reader learns this app by CONSISTENCY OF GESTURE. If Games sometimes shows a
 * chooser and sometimes launches a thing, the button means two things — and invariant 1
 * stops holding not because the control is unlabelled but because it is unpredictable.
 * Same taps, same result, every time.
 *
 * §1.6 APPLIES TO THIS SURFACE, NOT JUST TO GAMES. All three existing openers append a
 * full-bleed overlay early and wire CLOSE last — Draw 152 lines later, Camera 287, Map
 * 189 — and Map is a confirmed live trap whose recovery is killing the app. This is a
 * full-bleed overlay too, so the way back is appended and LIVE before a single tile
 * exists, and rendering them is wrapped: a throw inside tile rendering leaves a child
 * looking at an empty blue screen WITH A WORKING EXIT, rather than a trap. Check 17
 * demonstrates that by making the renderer throw on purpose.
 */
function closeGamePicker() {
  var o = document.getElementById('gamesPicker');
  if (o && o.parentNode) o.parentNode.removeChild(o);
}

/* One tile, built only from registry fields — it cannot know a game. `color` and `glow`
 * reach an inline style, and `registryEntryIsValid` is what makes them safe to splice;
 * read the note there before relaxing either. `label` and `icon` go through `textContent`
 * and cannot carry markup, which an adversarial pass confirmed with an <img onerror>. */
function pickerTile(entry) {
  var t = document.createElement('button');
  t.className = 'pickerTile';
  t.setAttribute('data-game', entry.id);
  t.setAttribute('aria-label', entry.label);
  /* BIG, because a three-year-old's aim is not an adult's, and the work order prefers
   * fewer bigger tiles to a grid that fits more. The floor is absolute so a narrow
   * viewport cannot shrink a tile below a thumb. */
  /* SIZED OFF THE AXIS THAT BINDS. `min(42vw,240px)` on both sides of a SQUARE tile
   * measured it entirely against the plentiful axis — 891px of width — and never against
   * the 411px that actually runs out. Scotty: "twice as big as they need to be... cut them
   * in half... centre them into a grid that fits on the one screen."
   *
   * `min(38vh, 42vw, 132px)` reads the binding axis first and still cannot exceed the old
   * width term or the halved ceiling. At 411px of height that is 132px, so TWO ROWS plus
   * the gap and padding come to 320 of 411 and the grid stays centred without scrolling.
   * THE `min-width` IS A RUNTIME SAFETY NET, NOT THE REQUIREMENT, AND THAT IS WHY IT IS 64
   * RATHER THAN THE 96 CHECK 17 ENFORCES. It was 150, the same literal the check carried,
   * and two expressions holding one number is why nobody noticed the number was invented.
   * Setting both to 96 was the obvious reconciliation AND IT MAKES THE CHECK
   * UNFALSIFIABLE: with the min on the threshold, a tile calc broken from 132 to 20 still
   * renders at exactly 96 and check 17 goes green — measured, not reasoned. So the min
   * sits at the 64px board cell Buddy demonstrably plays, which keeps a calc failure from
   * ever handing him something smaller than a target he already hits, while leaving it
   * BELOW the requirement so the check can see it. A backstop and a requirement are
   * different jobs. */
  t.style.cssText = 'width:min(38vh,42vw,132px);height:min(38vh,42vw,132px);min-width:64px;min-height:64px;'
    + 'border-radius:28px;border:3px solid ' + entry.glow + ';'
    + 'background:linear-gradient(160deg,rgba(255,255,255,0.12),rgba(0,0,0,0.30)),' + entry.color + ';'
    + 'display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;'
    /* `touch-action:none`, NOT `manipulation`, AND THE DIFFERENCE IS A THIRD INSTANCE OF
     * THE SAME DEFECT. With `manipulation` the browser is still allowed to treat a drag
     * as a pan, and the grid below is scrollable — so a tap that slid 25px produced
     * pointerdown, pointermove, POINTERCANCEL, touchend, and no pointerup at all. The
     * tile did nothing. Measured, not reasoned: the event list came off the element.
     *
     * That is the same shape as the exit being dead to a sliding tap, one surface later,
     * and it is why the fix became `wireTap` rather than a second copy — the wiring was
     * already right here; what was missing was forbidding the gesture that cancels it.
     * The grid keeps `pan-y`, so a drag in the GAPS still scrolls a long list. The trade
     * is that a child cannot scroll by dragging a tile itself, which is the right way
     * round: launching is the gesture he needs and scrolling is the one he does not. */
    + 'cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,0.45);touch-action:none;'
    + 'padding:0;-webkit-tap-highlight-color:transparent';
  var icon = document.createElement('div');
  icon.textContent = entry.icon;
  icon.style.cssText = 'font-size:min(20vh,18vw,64px);line-height:1;pointer-events:none';
  /* THE WORD IS FOR THE ADULT AND FOR THE CHILD WHO WILL ONE DAY READ IT. The ICON is
   * what has to work today — roadmap P2 gate 3 covers all the text and asks a stranger to
   * name the tile, so anything the word is carrying alone is a gate 3 failure. */
  var word = document.createElement('div');
  word.textContent = entry.label;
  word.style.cssText = 'font-size:16px;font-weight:700;letter-spacing:1px;color:#fff;'
    + 'text-shadow:0 2px 4px rgba(0,0,0,0.65);pointer-events:none';
  t.appendChild(icon);
  t.appendChild(word);
  /* Wired the same way as the exit, for the same reason: a tap with a second finger down,
   * or a tap that slides, emits no click. A tile that ignores a child's tap teaches him
   * the toy is broken just as effectively as an exit that does. */
  wireTap(t, function() {
    closeGamePicker();
    try { doSound(entry.sound); } catch (e) {}
    openGames(entry);
  });
  return t;
}

/* Called BY NAME from openGamePicker, deliberately: check 17 replaces it with one that
 * throws, to demonstrate that the way back survives a renderer that fails. The exit is
 * early-bound and cannot be reached that way, which is the asymmetry §2.3 asks for. */
function renderPickerTiles(host) {
  var grid = document.createElement('div');
  grid.id = 'pickerGrid';
  grid.style.cssText = 'position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;'
    /* `safe center`, NOT `center`. A centred flex container that OVERFLOWS pushes its
     * first rows ABOVE the scroll origin, and scrollTop cannot go negative — those tiles
     * can never be brought into view by any gesture. An adversarial pass measured the
     * floor: on an 800x480 tablet it breaks at the FIFTH registry entry, losing two
     * games, and at 1024x768 at the tenth. That falsifies invariant 6 outright — adding
     * the fifth game would silently delete two, and fixing it would be surgery on the
     * picker rather than a data change. `safe` degrades to flex-start exactly when
     * centring would push content out of reach.
     *
     * THE EXIT CLEARANCE IS A COLUMN NOW, NOT A BAND, and that is architecture §5 applied
     * to this file's own worst number. `padding-top:140px` was measured on a 768px-tall
     * tablet; on the 411px fleet screen 140 + a 240px tile + 24 = 404 of 411, so ONE ROW
     * BARELY FITS AND CLIPS and "Blocks" was below the fold. Scotty found it with
     * screenshots. The panel had already solved the same problem the other way — a left
     * gutter at x >= 84 that holds at EVERY height — and the height rule failed while the
     * column rule survived, in this same file, on the same day.
     *
     * AND THE COLUMN IS DERIVED FROM THE EXIT, NOT WRITTEN DOWN. makeBackButton puts the
     * exit at `left:max(10px, env(safe-area-inset-left))`, 64px wide, so on this fleet —
     * where the left inset measures ~30px — it occupies x 30-94, NOT the x 10-74 that a
     * literal would encode. A hardcoded column is the same defect as a hardcoded band,
     * one axis over. `env()` is the only thing that knows.
     *
     * The clearance is the hit box, not the paint: the transparent margin still
     * hit-tests, so a tile overlapping it lost a strip of its left edge to the exit —
     * measured in 165 of 440 viewport-by-count configurations. A mis-hit here teaches a
     * child the toy is broken, which is the same lesson a dead button teaches. */
    + 'align-content:safe center;justify-content:safe center;gap:20px;'
    + 'padding:16px 20px 20px max(94px,calc(env(safe-area-inset-left) + 84px));'
    + 'box-sizing:border-box;overflow:auto;touch-action:pan-y';
  /* AN INVALID ENTRY IS NOT A TILE. registryEntryIsValid enforces PUP-WO-0000 §9.1, and a
   * tile the shell would then refuse to load is a control that lies — the same reason
   * PUP-WO-0200's throwaway placeholder did not ship. */
  for (var i = 0; i < GAMES.length; i++) {
    if (registryEntryIsValid(GAMES[i])) grid.appendChild(pickerTile(GAMES[i]));
  }
  host.appendChild(grid);
}

function openGamePicker() {
  if (document.getElementById('gamesPicker')) return;
  /* A GAME IS UP — but "up" has to mean a game WITH DOM, and the first version of this
   * line did not check. `openGames` carries an explicit defence against exactly this,
   * with a comment naming it: a module that removes its own host leaves `gameSession`
   * non-null with no DOM, and the button then refuses FOREVER. Routing the Games button
   * through here reopened that bug ONE FUNCTION ABOVE where it had been closed — found
   * by an adversarial pass, which killed the button permanently and noted that a
   * three-year-old cannot restart an app. Recover instead of latching on a corpse. */
  if (gameSession) {
    if (gameSession.chrome && gameSession.chrome.parentNode) return;
    if (window.console && console.warn) console.warn('[picker] previous session lost its DOM; recovering');
    endGameSession();
  }

  var overlay = document.createElement('div');
  overlay.id = 'gamesPicker';
  overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:' + PICKER_Z + ';'
    + 'background:linear-gradient(180deg,#1E3A5F,#172554 50%,#0F1D3A);overflow:hidden;'
    + 'font-family:Trebuchet MS,sans-serif';

  /* THE WAY BACK FIRST. Not after the tiles, not in the same statement as the tiles.
   * Everything below this line can fail; nothing below it can strand anyone. */
  var back = makeBackButton(PICKER_Z + 1, function() {
    closeGamePicker();
    try { doSound('tap'); } catch (e) {}
  });
  back.id = 'pickerBack';
  overlay.appendChild(back);
  document.body.appendChild(overlay);

  try {
    renderPickerTiles(overlay);
  } catch (e) {
    if (window.console && console.error) console.error('[picker] tiles failed to render; the way back still works', e);
  }
}

    +'<div style="width:24px;height:2px;border-radius:1px;background:linear-gradient(90deg,rgba(56,189,248,0.25),transparent)"></div>'
    +'</div>'

    +'</div>';

/* === Event Binding === */
function attachEvents() {
  document.querySelectorAll('.pad-btn').forEach(function(el) {
    /* THROUGH wireTap, AND THIS IS THE ENTRY POINT THE HARDENING HAD MISSED. PUP-WO-0201
     * wired the tiles and both exits against a tap with a second finger down and a tap
     * that slides — and left the seven buttons that REACH them on bare `click`, which a
     * browser does not synthesise for either gesture. An adversarial pass showed the
     * Games button doing nothing at all in both cases: the picker's only door, inert to
     * a two-handed child, behind a surface built entirely for one.
     * `repeat` because a pad button is pressed all day, unlike an exit or a tile, which
     * destroy the surface they live on. */
    wireTap(el, function() {
      var id = parseInt(el.dataset.id);
      var btn = BTNS_LEFT.concat(BTNS_RIGHT).find(function(b){return b.id===id});
      if (!btn) return;
      doSound(btn.sound);
      if (btn.id === 3) { triggerAlertEffect(); pushAlert(); }
      /* PUP-WO-0701 §S2.1. Comms was decorative -- doSound plus a toast -- so this
       * makes an existing button real rather than adding a ninth. The pad is 4+4 at a
       * 412px CSS viewport and a ninth button re-flows the grid on the only device that
       * counts. Returns early exactly as Map, Draw and Camera do. */
      if (btn.id === 0) { openVoice(); return; }
      if (btn.id === 1) { openTreasureMap(); return; }
      if (btn.id === 2) { openCanvas(); return; }
      if (btn.id === 6) { openCamera(); return; }
      /* PUP-WO-0200 §1.2. Returns early exactly as Map, Draw and Camera do, so the
       * console's own state machine is untouched — the games surface is a separate
       * layer, not a console mode.
       * WHICH entry opens is PUP-WO-0201's question, not this one's: the picker
       * overlay is explicitly out of scope here (§4), so this mounts the first
       * registry entry. That is a wire-up, not a chooser. */
      /* PUP-WO-0201. This was `openGames()` — a wire-up rather than a chooser, correct
       * under PUP-WO-0200's fence, which named the picker as the next work order's. It
       * is that work order now, so the button opens the CHOOSER and a tile opens a game.
       * Returns early exactly as Map, Draw and Camera do; the console's state machine is
       * untouched, because the picker is a separate layer and not a console mode. */
      if (btn.id === 7) { openGamePicker(); return; }
      state.pid = btn.id;
      state.active = btn;
      state.pop = btn.msg;
      updateUI();
      clearTimeout(activeTimer);
      activeTimer = setTimeout(function() {
        state.active = null; state.pop = ''; state.pid = -1;
        updateUI();
      }, btn.id === 3 ? 4500 : 2500);
    }, { repeat: true });
  });

  /* === THE RADAR'S LONG PRESS — PUP-WO-0602 ================================
   *
   * WHY THIS IS NOT `wireTap`, RULED WITH THE CODE IN FRONT OF ME RATHER THAN BY
   * FAMILY RESEMBLANCE. wireTap (:2099) already handles the three gestures a
   * three-year-old actually makes, so reaching for it is the obvious move — and it does
   * not fit, for three reasons that are properties of the gesture rather than taste:
   *
   *   1. wireTap FIRES ON `pointerup`. A long press must fire WHILE THE FINGER IS STILL
   *      DOWN, at LONG_PRESS_MS, with no pointerup in sight. wireTap owns no timer and
   *      has no concept of one; a long press is not a tap that took longer.
   *   2. ONE GESTURE HERE HAS TWO OUTCOMES — a paw on a short tap, an X on a long press —
   *      and wireTap's contract is one function per element.
   *   3. wireTap's `fn()` TAKES NO ARGUMENTS. Both marks are placed at the press
   *      coordinates, and there is nowhere in that signature for them.
   *
   * So the three properties are BUILT HERE DELIBERATELY rather than inherited by
   * accident. What is borrowed is the discipline, not the function: one owner per press,
   * and every way the press can end releases it.
   *
   * THE RADAR PREDATES wireTap AND NEVER WENT BACK FOR ITS `pointercancel`. wireTap has
   * one at :2111 and the settings slider has one at :2485; this had none, so the ONE
   * EVENT THE BROWSER SENDS WHEN IT TAKES A GESTURE AWAY was the one event the app's
   * central feature ignored. That is the same shape as `.bp-drag[hidden]` and as the
   * passive-listener guard in PUP-WO-0603: THE REMEDY WAS ALREADY IN THE FILE, APPLIED TO
   * THE NEWER CODE, AND THE OLDER CODE NEVER CAME BACK FOR IT. Third instance. */
  var radar = document.getElementById('radarArea');
  if (radar) {
    /* One pointer owns the press. A second finger used to call this handler again,
     * RESTART the timer and overwrite longPressPos — so the X landed wherever the second
     * finger was, and the press the child had actually been holding was discarded. A
     * three-year-old always has a second contact. */
    var radarPid = -1;

    function endRadarPress() {
      clearTimeout(longPressTimer);
      longPressTimer = null;
      radarPid = -1;
    }

    radar.addEventListener('pointerdown', function(e) {
      if (radarPid !== -1) return;
      radarPid = e.pointerId;
      var rect = radar.getBoundingClientRect();
      var xPct = ((e.clientX - rect.left) / rect.width) * 100;
      var yPct = ((e.clientY - rect.top) / rect.height) * 100;
      longPressPos = {x: xPct, y: yPct};
      didLongPress = false;
      longPressTimer = setTimeout(function() {
        didLongPress = true;
        longPressTimer = null;
        spawnX(longPressPos.x, longPressPos.y);
        pushXMark(longPressPos.x, longPressPos.y);
      }, LONG_PRESS_MS);
    });
    radar.addEventListener('pointerup', function(e) {
      if (radarPid !== -1 && e.pointerId !== radarPid) return;
      var fired = didLongPress;
      endRadarPress();
      if (!fired) {
        var rect = radar.getBoundingClientRect();
        var xPct = ((e.clientX - rect.left) / rect.width) * 100;
        var yPct = ((e.clientY - rect.top) / rect.height) * 100;
        spawnPaw(xPct, yPct);
      }
    });
    /* THE EVENT THIS FEATURE HAS NEVER HANDLED. The browser sends `pointercancel` when
     * it claims a gesture for itself — a scroll, a text selection, a context menu — and
     * when it does, NEITHER pointerup NOR pointerleave is guaranteed to arrive. Without
     * this the timer survived the gesture that was taken away and stamped an X the child
     * never completed, at a position from a press that no longer existed. */
    radar.addEventListener('pointercancel', function(e) {
      if (radarPid !== -1 && e.pointerId !== radarPid) return;
      didLongPress = false;
      endRadarPress();
    });
    radar.addEventListener('pointerleave', function() {
      endRadarPress();
    });
    /* SCOPED TO THE RADAR, AND THAT SCOPE IS THE WHOLE OF IT. A document-level
     * suppression would satisfy the symptom and REMOVE TEXT SELECTION FROM EVERY ADULT
     * SURFACE — the settings panel, the PIN entry, the Supabase fields — which
     * PUP-WO-0602 §5 names as a flag-and-stop. `contextmenu` appeared ZERO times in this
     * file before this line.
     *
     * NOT ALSO `-webkit-touch-callout`, DELIBERATELY. It is a WebKit property that Chrome
     * does not implement, and the fleet is three Android phones (architecture §3). Adding
     * it would read as a second layer of defence and be inert on every device we ship to
     * — the maximum-scale trap from PUP-WO-0603, one work order later. */
    radar.addEventListener('contextmenu', function(e) { e.preventDefault(); });
  }

  var lockBtn = document.getElementById('lockBtn');
  if (lockBtn) lockBtn.addEventListener('click', function() {
    if (state.isLocked) showPinOverlay('unlock');
    else showPinOverlay('set');
  });

  var settingsBtn = document.getElementById('settingsBtn');
  if (settingsBtn) settingsBtn.addEventListener('click', showSettings);
}
